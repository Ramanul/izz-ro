name: gemini review

# Al doilea recenzor AI pe un furnizor diferit de Claude. Review-ul este ADVISORY: nu devine
# merge gate, deoarece quota/retea/model availability sunt dependente de un serviciu extern.
# Fiecare update al PR-ului retriggereaza analiza; asta evita ca un fix nou sa ramana neverificat.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Numarul PR-ului de revizuit"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/pr_review_gemini.py ${{ github.event.pull_request.number || inputs.pr }}

      - name: Cheie lipsa
        if: env.HAS_KEY != 'true'
        run: echo "GEMINI_API_KEY nu e setat - review-ul extern este indisponibil."
