name: cua-remote
permissions:
  contents: write
on:
  push:
    paths:
      - '.cua/commands.cmd'
jobs:
  local:
    runs-on: [self-hosted, windows-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Executa comenzi pe PC-ul local si salveaza rezultatul
        shell: cmd
        run: |
          .cua\commands.cmd > .cua\result.txt 2>&1
          echo. >> .cua\result.txt
          echo EXIT=%ERRORLEVEL% SHA=%GITHUB_SHA% >> .cua\result.txt
      - name: Comite rezultatul inapoi in branch
        shell: cmd
        if: always()
        run: |
          git config --global user.name cua-runner
          git config --global user.email cua@users.noreply.github.com
          git add .cua\result.txt
          git commit -m "cua: rezultat rulare" || exit /b 0
          git pull --rebase origin %GITHUB_REF_NAME% || echo rebase_skip
          git push origin HEAD:%GITHUB_REF_NAME%
