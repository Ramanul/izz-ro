name: cua-remote

# OPRIT. Înainte: orice push care atingea .cua/commands.cmd pornea scriptul pe
# runnerul Windows persistent și împingea rezultatul înapoi, cu contents: write
# și checkout nefixat. Push-ul dintr-un fork nu aprindea evenimentul, dar orice
# drept de scriere (sau un token furat) ajungea pe PC. Triggerul de push a fost
# scos ca un commit pe fișierul ăsta să nu mai programeze jobul pe runner.
# Înregistrarea veche cua-poll-test nu mai are fișier pe main; se șterge din
# Settings → Actions → Runners / workflow-uri, nu din YAML.

on:
  workflow_dispatch:

permissions: {}

jobs:
  refuzat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execuția arbitrară este oprită
        run: |
          echo "::error::cua-remote este oprit. .cua/commands.cmd nu se mai execută."
          exit 1
