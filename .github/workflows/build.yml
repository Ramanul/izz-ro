name: pipeline

# Munca grea: fetch RSS + AI (buget per rulare) + salveaza starea in git.
# Commit-ul pe main declanseaza deploy-worker.yml din GitHub Actions, care randeaza si publica output-ul in Workers Static Assets.

on:
  # Incercare orara; poarta de cadenta mentine aproximativ 2 ore intre commituri de continut.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      max_ai_calls:
        description: >-
          Buget de apeluri AI pentru aceasta rulare (gol = 40, ca la cron).
          Util pentru o populare accelerata sau pentru recuperarea unei cozi mari de articole.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cadenta:
    runs-on: ubuntu-latest
    outputs:
      ruleaza: ${{ steps.g.outputs.ruleaza }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRAG_MIN: "105"
        run: |
          set -euo pipefail
          ultim=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/articles.json&per_page=1" \
                    --jq '.[0].commit.committer.date')
          varsta=$(( ( $(date +%s) - $(date -d "$ultim" +%s) ) / 60 ))
          echo "ultimul commit de continut: $ultim (acum $varsta min, prag $PRAG_MIN)"
          if [ "$varsta" -ge "$PRAG_MIN" ]; then
            echo "ruleaza=true" >> "$GITHUB_OUTPUT"
          else
            echo "ruleaza=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sar peste: continutul are $varsta min, sub pragul de $PRAG_MIN"
          fi

  pipeline:
    needs: cadenta
    if: github.event_name != 'schedule' || needs.cadenta.outputs.ruleaza == 'true'
    runs-on: ubuntu-latest
    outputs:
      content_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      # Suita rapida (~1 min de la IZZ-0415: fixtura randeaza un esantion de 200 articole)
      # inainte de cheltuirea bugetului AI, ca un cod regresat sa nu consume 40 de apeluri
      # si sa nu comite stare deasupra unui defect. RAPORT-ONLY la aterizare: content job-ul
      # e pulsul site-ului, iar un test fragil ar ingheta publicarea tăcut — comutatorul
      # (scoaterea `continue-on-error`) se aplica dupa o saptamana de rulari verzi.
      - name: Suita de teste (raport-only, IZZ-0415)
        continue-on-error: true
        run: python -m pytest -q

      - name: Chromium pentru imagini (best-effort)
        id: chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Ruleaza pipeline (fetch + AI, buget)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          MAX_AI_CALLS_PER_RUN: ${{ github.event.inputs.max_ai_calls != '' && github.event.inputs.max_ai_calls || '40' }}
          # Cascada de provideri GRATUITI. Fiecare are cota proprie si niciunul nu factureaza
          # depasirea (Gemini RPD/TPM, Cerebras 1M tokeni/zi, Groq rate-limit — sursele in
          # `ai_gateway/registry.yaml`), deci bugetul real al unei rulari e SUMA cotelor, nu
          # o cifra globala impartita. De asta `AI_CALLS_PER_PROVIDER` e aceeasi cifra ca
          # `MAX_AI_CALLS_PER_RUN`: cu un singur provider disponibil rezultatul e identic cu
          # inainte (40 × 1), cu doi e 80, cu trei 120.
          #
          # Cheile sunt OPTIONALE. `openai_compat.configured_compatible_providers()` construieste
          # doar providerii cu cheie prezenta, iar `process.get_provider()` filtreaza din nou pe
          # `available()` — deci un secret absent NU umfla bugetul si nu schimba nimic fata de
          # comportamentul curent. Activarea e: adaugi GROQ_API_KEY / CEREBRAS_API_KEY in
          # Settings → Secrets, atat.
          AI_ROUTER_MODE: multi
          AI_FALLBACK_PROVIDERS: groq,cerebras
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_CALLS_PER_PROVIDER: ${{ github.event.inputs.max_ai_calls != '' && github.event.inputs.max_ai_calls || '40' }}
          UPGRADE_RESERVE: "4"
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          IZZ_RAPORT_COPIERE_GATE: ${{ runner.temp }}/izz-grounding-gate.jsonl
          # Poartă umană pentru sintezele C: armabilă din UI (Settings → Secrets and
          # variables → Actions → Variables → IZZ_REQUIRE_HUMAN_GATE=true), fără atingere
          # de cod. Default false: proprietar netehnic + poartă mereu pornită = site
          # înghețat tăcut (failure mode „Tăcere" din audit); comutatorul rămâne la el.
          IZZ_REQUIRE_HUMAN_GATE: ${{ vars.IZZ_REQUIRE_HUMAN_GATE || 'false' }}
        run: python -m generator.main

      - name: Grounding gate (blocant pentru citate/cifre straine)
        env:
          IZZ_RAPORT_COPIERE_GATE: ${{ runner.temp }}/izz-grounding-gate.jsonl
        run: python tools/grounding_gate.py

      # Jurnalul observational e materia prima pentru praguri (vezi antetul din
      # generator/verifica_sinteza.py): fara upload dispare odata cu runner-ul, deci
      # pragurile noi (ex. cuvant_strain_titlu) ar ramane fara cifre pe care sa se
      # calibreze. Pastrat 30 de zile; fisierul poate lipsi (rulari fara AI) - nu-i eroare.
      - name: Salveaza jurnalul de masurare sinteza
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raport-copiere-${{ github.run_id }}
          path: data/raport_copiere.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Genereaza imagini per-articol (HTML/Chromium, best-effort)
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MAX_IMAGES_PER_RUN: "80"
        run: python tools/gen_images.py

      - name: Portrete persoane publice (Wikidata, best-effort)
        continue-on-error: true
        env:
          MAX_PORTRAIT_LOOKUPS: "20"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
        run: python tools/fetch_portraits.py

      - name: Fotografii lead per articol (Wikidata P18 landscape+PD, best-effort)
        continue-on-error: true
        env:
          MAX_LEAD_LOOKUPS: "20"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
        run: python tools/fetch_leadphotos.py

      - name: Poze DE LA eveniment (Commons, fereastra stirii, clasa A)
        continue-on-error: true
        env:
          MAX_EVENT_LOOKUPS: "10"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
        run: python tools/fetch_eventphotos.py

      - name: IndexNow — ce s-a schimbat (scrie manifestul, NU trimite inca)
        continue-on-error: true
        run: python tools/indexnow_submit.py --plan

      - name: QA check (blocking, inainte de commit)
        run: python tools/qa_check.py

      - name: Genereaza datasetul hartii (proaspat la fiecare commit de continut)
        # Fara pasul asta harta traia din merge-urile de PR facute de un om: commitul de
        # mai jos e impins cu GITHUB_TOKEN, iar GitHub taie recursia — un push facut cu
        # GITHUB_TOKEN nu aprinde workflow-uri pe `push`, deci harta-data.yml nu se
        # declansa pana la urmatorul merge uman (masurat 2026-10-03: map.json cu 12h in
        # urma fata de articles.json). Regenerarea punctelor de localitati
        # (build_harta_localitati.py, cere retea) ramane in harta-data.yml, care ruleaza
        # la schimbarile de cod hartii.
        run: python tools/build_harta_data.py

      - name: Comite starea (declanseaza deploy-worker.yml)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "izz-bot"
          git config user.email "bot@izz.ro"
          git add data/articles.json data/feed_cache.json
          git add static/harta-stiri/data/map.json static/harta-stiri/data/projection.json 2>/dev/null || true
          git add data/takedown_log.jsonl 2>/dev/null || true
          git add data/triage_log.jsonl 2>/dev/null || true
          git add data/indexnow_seen.json 2>/dev/null || true
          git add data/portraits.json 2>/dev/null || true
          git add data/leadphotos.json 2>/dev/null || true
          git add data/eventphotos-miss.json 2>/dev/null || true
          git add data/localities_coords.json 2>/dev/null || true
          git add media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::nimic de comis - pipeline-ul nu a schimbat niciun fisier"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "update content"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push OK la incercarea $i"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::push respins (incercarea $i) - reaplic peste origin/main"
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort
              echo "::error::conflict la rebase peste origin/main - continutul acestei rulari NU a fost publicat"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::push esuat dupa 5 incercari - continutul NU a ajuns pe main, deploy-ul GitHub Actions NU s-a declansat"
          exit 1

      - name: IndexNow — trimite coada (dupa deploy, best-effort)
        continue-on-error: true
        run: python tools/indexnow_submit.py --send

  mirror:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Refuza oglindirea fara sha de continut
        env:
          CONTENT_SHA: ${{ needs.pipeline.outputs.content_sha }}
        run: |
          if [ -z "$CONTENT_SHA" ]; then
            echo "::error::pipeline nu a raportat content_sha - refuz sa oglindesc"
            exit 1
          fi
          echo "oglindesc $CONTENT_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pipeline.outputs.content_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Render (rapid, fara fetch/AI)
        env:
          # IZZ-0373, partea (b). Jobul asta face checkout pe `content_sha`, dar `GITHUB_SHA`
          # ramane commitul care a DECLANSAT rularea — un STRAMOS al continutului. Fara linia
          # de mai jos, manifestul mirror-ului poarta commitul gresit, iar `verify_release.py`
          # nu poate compara mirror-ul pe commit si cade pe `generated_at`.
          # Partea (a) — `BUILD_COMMIT_SHA` bate `GITHUB_SHA` in `render._write_build_metadata`
          # — era deja facuta pe 2026-09-12 si era INERTA fara asta: `GITHUB_SHA` e mereu setat
          # in Actions, deci ar fi castigat oricum daca ar fi fost primul in lant.
          BUILD_COMMIT_SHA: ${{ needs.pipeline.outputs.content_sha }}
          # IZZ-0423 (arhiva, #198): mirror-ul NU are plafonul de 20.000 de fisiere al
          # Workers Free (gh-pages = 1 GB). Supapa de buget e ridicata aici si numai aici:
          # intregul set din fereastra TTL se randeaza, iar impreuna cu `keep_files` la
          # publicare paginile pensionate supravietuiesc pe oglinda la aceeasi adresa.
          # Primarul NU-si schimba supapa — oglinda suporta fara ea.
          OUTPUT_FILE_BUDGET: "100000"
          OUTPUT_FILE_CEILING: "110000"
          OUTPUT_NON_ARTICLE_RESERVE: "1000"
          # Oglinda serveste pagini de articol la 404 (worker-404-mirror.js), nu /cauta/,
          # deci indexul de cautare n-are ce cauta aici. Costul evitat e real: bucatile de
          # index au nume-amprentate, deci `keep_files: true` ar acumula ~50 de fisiere noi
          # la fiecare republicare (de ~12 ori pe zi) intr-un repo cu plafon 1 GB, masurat
          # deja lunar. Pe primar indexul se construieste — vezi generator/pagefind_index.py.
          PAGEFIND_ENABLED: "0"
        run: python -m generator.main --render-only
      - name: Publica pe mirror (host independent)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          external_repository: Ramanul/ramanul.github.io
          publish_branch: gh-pages
          publish_dir: ./output
          # IZZ-0423: fara force_orphan + keep_files. Paginile iesite din fereasta TTL
          # NU se sterg la republicare — oglinda devine arhiva vietii destinate (#198).
          # Urmare acceptata: adaugare continua de fisiere vechi pe gh-pages (plafon
          # platformei 1 GB); masuram lunar cu automation-5331e2e9 si setam taierea
          # cand ne apropiem — NU azi. Fallback-ul 404->mirror pe primar e PR separat.
          keep_files: true
          cname: ""

  release-probe:
    needs: [pipeline, mirror]
    if: ${{ needs.pipeline.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pipeline.outputs.content_sha }}
      - name: Verifica release-ul public pe originea Workers si pe izz.ro
        env:
          EXPECTED_COMMIT: ${{ needs.pipeline.outputs.content_sha }}
          # 25 de minute nu acoperea decalajul structur al lantului: commiturile de continut
          # impinse cu GITHUB_TOKEN NU declanseaza push-workflows, deci release-ul asteapta
          # cronul :53 al deploy-worker — in cazul rau, probe moare cu ~17 minute inainte sa
          # fie verificabil (rosul din 3 oct). 65 de minute acopera urmatorul ciclu de cron.
          RELEASE_TIMEOUT_SECONDS: "3900"
          RELEASE_POLL_SECONDS: "30"
          RELEASE_ALT_ORIGIN: ${{ vars.ALT_ORIGIN || 'https://izz-ro.andifreelancer2.workers.dev' }}
        run: python tools/verify_release.py
