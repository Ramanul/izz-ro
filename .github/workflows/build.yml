name: pipeline

# Munca grea: fetch RSS + AI (buget per rulare) + salveaza starea in git.
# Commit-ul declanseaza Cloudflare Workers Static Assets, care servesc output-ul generat.

on:
  # Incercare orara; poarta de cadenta mentine aproximativ 2 ore intre commituri de continut.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      max_ai_calls:
        description: >-
          Buget de apeluri AI pentru aceasta rulare (gol = 40, ca la cron).
          Util pentru o populare accelerata sau pentru recuperarea unei cozi mari de articole.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cadenta:
    runs-on: ubuntu-latest
    outputs:
      ruleaza: ${{ steps.g.outputs.ruleaza }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRAG_MIN: "105"
        run: |
          set -euo pipefail
          ultim=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/articles.json&per_page=1" \
                    --jq '.[0].commit.committer.date')
          varsta=$(( ( $(date +%s) - $(date -d "$ultim" +%s) ) / 60 ))
          echo "ultimul commit de continut: $ultim (acum $varsta min, prag $PRAG_MIN)"
          if [ "$varsta" -ge "$PRAG_MIN" ]; then
            echo "ruleaza=true" >> "$GITHUB_OUTPUT"
          else
            echo "ruleaza=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sar peste: continutul are $varsta min, sub pragul de $PRAG_MIN"
          fi

  pipeline:
    needs: cadenta
    if: github.event_name != 'schedule' || needs.cadenta.outputs.ruleaza == 'true'
    runs-on: ubuntu-latest
    outputs:
      content_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Chromium pentru imagini (best-effort)
        id: chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Ruleaza pipeline (fetch + AI, buget)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          MAX_AI_CALLS_PER_RUN: ${{ github.event.inputs.max_ai_calls != '' && github.event.inputs.max_ai_calls || '40' }}
          UPGRADE_RESERVE: "4"
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          IZZ_RAPORT_COPIERE_GATE: ${{ runner.temp }}/izz-grounding-gate.jsonl
          # Poartă umană pentru sintezele C: armabilă din UI (Settings → Secrets and
          # variables → Actions → Variables → IZZ_REQUIRE_HUMAN_GATE=true), fără atingere
          # de cod. Default false: proprietar netehnic + poartă mereu pornită = site
          # înghețat tăcut (failure mode „Tăcere" din audit); comutatorul rămâne la el.
          IZZ_REQUIRE_HUMAN_GATE: ${{ vars.IZZ_REQUIRE_HUMAN_GATE || 'false' }}
        run: python -m generator.main

      - name: Grounding gate (blocant pentru citate/cifre straine)
        env:
          IZZ_RAPORT_COPIERE_GATE: ${{ runner.temp }}/izz-grounding-gate.jsonl
        run: python tools/grounding_gate.py

      - name: Genereaza imagini per-articol (HTML/Chromium, best-effort)
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MAX_IMAGES_PER_RUN: "80"
        run: python tools/gen_images.py

      - name: Portrete persoane publice (Wikidata, best-effort)
        continue-on-error: true
        env:
          MAX_PORTRAIT_LOOKUPS: "20"
        run: python tools/fetch_portraits.py

      - name: Fotografii lead per articol (Wikidata P18 landscape+PD, best-effort)
        continue-on-error: true
        env:
          MAX_LEAD_LOOKUPS: "20"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
        run: python tools/fetch_leadphotos.py

      - name: IndexNow — ce s-a schimbat (scrie manifestul, NU trimite inca)
        continue-on-error: true
        run: python tools/indexnow_submit.py --plan

      - name: QA check (blocking, inainte de commit)
        run: python tools/qa_check.py

      - name: Comite starea (declanseaza deploy Cloudflare)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "izz-bot"
          git config user.email "bot@izz.ro"
          git add data/articles.json data/feed_cache.json
          git add data/takedown_log.jsonl 2>/dev/null || true
          git add data/triage_log.jsonl 2>/dev/null || true
          git add data/indexnow_seen.json 2>/dev/null || true
          git add data/portraits.json 2>/dev/null || true
          git add data/leadphotos.json 2>/dev/null || true
          git add media 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::nimic de comis - pipeline-ul nu a schimbat niciun fisier"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "update content"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push OK la incercarea $i"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::push respins (incercarea $i) - reaplic peste origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::conflict la rebase peste origin/main - continutul acestei rulari NU a fost publicat"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::push esuat dupa 5 incercari - continutul NU a ajuns pe main, deploy-ul NU s-a declansat"
          exit 1

      - name: IndexNow — trimite coada (dupa deploy, best-effort)
        continue-on-error: true
        run: python tools/indexnow_submit.py --send

  mirror:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Refuza oglindirea fara sha de continut
        env:
          CONTENT_SHA: ${{ needs.pipeline.outputs.content_sha }}
        run: |
          if [ -z "$CONTENT_SHA" ]; then
            echo "::error::pipeline nu a raportat content_sha - refuz sa oglindesc"
            exit 1
          fi
          echo "oglindesc $CONTENT_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pipeline.outputs.content_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Render (rapid, fara fetch/AI)
        run: python -m generator.main --render-only
      - name: Publica pe mirror (host independent)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          external_repository: Ramanul/ramanul.github.io
          publish_branch: gh-pages
          publish_dir: ./output
          force_orphan: true
          cname: ""

  release-probe:
    needs: [pipeline, mirror]
    if: ${{ needs.pipeline.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pipeline.outputs.content_sha }}
      - name: Verifica release-ul public pe originea Workers si pe izz.ro
        env:
          EXPECTED_COMMIT: ${{ needs.pipeline.outputs.content_sha }}
          RELEASE_TIMEOUT_SECONDS: "1500"
          RELEASE_POLL_SECONDS: "30"
          RELEASE_ALT_ORIGIN: ${{ vars.ALT_ORIGIN || 'https://izz-ro.andifreelancer2.workers.dev' }}
        run: python tools/verify_release.py
