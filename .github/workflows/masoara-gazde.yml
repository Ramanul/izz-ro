name: masoara-gazde

# Pasul 1 din specs/anomalie-linkuri.md: corpusul din care se alege lista de gazde a garzii.
# MANUAL, nu programat: e o masuratoare care se face o data si produce cifre, nu un monitor.
# Ruleaza aici fiindca site-urile de stiri sunt refuzate de proxy-ul de agent dintr-o sesiune
# remote, dar runnerul ajunge la ele — al patrulea canal din CLAUDE.md §12a.
on:
  workflow_dispatch:
    inputs:
      surse:
        description: 'Cate surse din SOURCES sa fie citite (implicit 40)'
        required: false
        default: '40'

permissions:
  contents: read

jobs:
  gazde:
    name: Unde duc linkurile din corpurile de articol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Numara gazdele-destinatie
        env:
          SURSE: ${{ inputs.surse }}
        run: python tools/masoara_gazde.py "$SURSE"
