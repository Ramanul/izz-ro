name: deploy-worker

# Buton MANUAL de publicare pe Worker-ul izz-ro. Nu are trigger automat: publicarea normala este
# facuta din git prin pipeline. Workflow-ul este fail-closed si publica DOAR continutul din main.
# Tokenul este scoped pe Workers Scripts:Edit + Account Settings:Read; NU poate atinge DNS/WAF.

on:
  workflow_dispatch:
    inputs:
      confirmare:
        description: 'Scrie exact: deploy'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Poarta - confirmare + ramura
        run: |
          if [ "${{ inputs.confirmare }}" != "deploy" ]; then
            echo "::error::Confirmare lipsa sau gresita - scrie exact 'deploy' in casuta."
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Rulat pe ${{ github.ref }}. Publicarea in productie se face DOAR de pe main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Randeaza site-ul
        run: python -m generator.main --render-only

      - name: Verifica outputul inainte de productie
        run: |
          set -euo pipefail
          test -s output/index.html || { echo "::error::output/index.html lipseste - render picat, NU publicam"; exit 1; }
          n=$(find output -type f | wc -l)
          echo "fisiere de publicat: $n"
          [ "$n" -ge 1000 ] || { echo "::error::doar $n fisiere - render incomplet, NU publicam"; exit 1; }

      - name: Publica pe Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.125.0 deploy

      # HTTP 200 singur nu detecteaza un release ramas in urma. Verificam manifestul buildului,
      # SHA-ul si numarul de articole. Origin-only este intentionat: domeniul public poate avea
      # bot challenge din runnerii GitHub; `build.yml` incearca ambele origini cand acestea sunt accesibile.
      - name: Verifica release-ul pe Worker
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_BASE_URLS: ${{ vars.ALT_ORIGIN || 'https://izz-ro.andifreelancer2.workers.dev' }}
          RELEASE_TIMEOUT_SECONDS: "300"
          RELEASE_POLL_SECONDS: "15"
        run: python tools/verify_release.py
