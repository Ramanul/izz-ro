name: deploy-worker

# Publicare pe Worker-ul izz-ro. Trigger automat: orice push pe main — inlocuieste Workers Builds,
# care factura minutele de build (7.407 min peste plafon in Aug 22-Sep 21 = $37.04). Butonul manual
# ramane, cu poarta de confirmare 'deploy'. Workflow-ul este fail-closed si publica DOAR continutul
# din main. Tokenul este scoped pe Workers Scripts:Edit + Account Settings:Read; NU poate atinge DNS/WAF.

on:
  push:
    branches: [main]
  # Deploy orar de siguranta: comiturile de continut ale build.yml folosesc GITHUB_TOKEN,
  # care NU declanseaza workflow-uri pe push (anti-recursivitate GitHub). Fara acest cron,
  # continutul publicat de pipeline ar ramane nerealizat dupa deconectarea Workers Builds.
  #
  # Calea NORMALA de declansare dupa un commit de continut este acum `gh workflow run` din
  # `build.yml` (imediat dupa push, cu `-f confirmare=deploy`): `workflow_dispatch` este
  # exceptia documentata de la anti-recursivitate. Cronul ramane plasa de siguranta pentru
  # cazul in care dispatch-ul nu ajunge — masurat 2026-10-10, GitHub livreaza cererea `:53`
  # la ~3h30m, nu orar, deci singur nu putea publica la timp.
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      confirmare:
        description: 'Scrie exact: deploy'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Poarta - confirmare (manual) + ramura
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMARE: ${{ inputs.confirmare }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMARE" != "deploy" ]; then
            echo "::error::Confirmare lipsa sau gresita - scrie exact 'deploy' in casuta."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Rulat pe $REF. Publicarea in productie se face DOAR de pe main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Randeaza site-ul
        run: python -m generator.main --render-only

      - name: Verifica outputul inainte de productie
        run: |
          set -euo pipefail
          test -s output/index.html || { echo "::error::output/index.html lipseste - render picat, NU publicam"; exit 1; }
          n=$(find output -type f | wc -l)
          echo "fisiere de publicat: $n"
          [ "$n" -ge 1000 ] || { echo "::error::doar $n fisiere - render incomplet, NU publicam"; exit 1; }

      - name: Buget redirecte (plafon Cloudflare ~2.000 reguli statice)
        run: |
          set -euo pipefail
          if [ -f output/_redirects ]; then
            n=$(grep -cv '^\s*$\|^#' output/_redirects || true)
            echo "redirecturi active: $n"
            if [ "$n" -gt 2100 ]; then echo "::error::$n redirecturi > 2.100 - Cloudflare va refuza regulile"; exit 1; fi
            if [ "$n" -gt 1800 ]; then echo "::warning::$n redirecturi > 1.800 - aproape de plafon"; fi
          else
            echo "fara output/_redirects - sar pasul"
          fi

      - name: Buget assets (strict, dupa randare si indexare)
        run: |
          python tools/asset_budget.py --output-dir output --enforce

      - name: Publica pe Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.125.0 deploy

      # HTTP 200 singur nu detecteaza un release ramas in urma. Verificam manifestul buildului,
      # SHA-ul si numarul de articole. Origin-only este intentionat: domeniul public poate avea
      # bot challenge din runnerii GitHub; `build.yml` incearca ambele origini cand acestea sunt accesibile.
      - name: Verifica release-ul pe Worker
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_BASE_URLS: ${{ vars.ALT_ORIGIN || 'https://izz-ro.andifreelancer2.workers.dev' }}
          RELEASE_TIMEOUT_SECONDS: "300"
          RELEASE_POLL_SECONDS: "15"
        run: python tools/verify_release.py
      # Challenge-ul dovedit rămâne neconcludent pentru runner, dar o eroare HTTP sau
      # un conținut înghețat nu mai poate fi ascunsă de «best-effort».
      - name: Verifica izz.ro (challenge neconcludent, eroarea blochează)
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set +e
          python tools/public_probe.py https://izz.ro
          probe=$?
          set -e
          if [ "$probe" -eq 2 ]; then
            echo "::warning::izz.ro nu poate fi verificat de runner (challenge/rețea); release-ul Worker e confirmat separat"
          elif [ "$probe" -ne 0 ]; then
            echo "::error::izz.ro răspunde cu eroare sau conținut înghețat"
            exit 1
          else
            RELEASE_BASE_URLS=https://izz.ro RELEASE_TIMEOUT_SECONDS=300 RELEASE_POLL_SECONDS=20 python tools/verify_release.py
          fi
