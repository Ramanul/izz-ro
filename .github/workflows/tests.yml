name: tests

# Suita minima pytest (functii pure: util/state/cluster/config). Ruleaza pe PR-uri,
# la push in main CAND SE ATINGE COD, si manual -- NU pe commit-urile de continut
# la 2h (ating doar data/*.json), care raman filtrate prin `paths` de mai jos.
#
# `push` adaugat 2026-08-17. Motivul: fara el `main` nu era verificat NICIODATA, iar
# doua importuri moarte au stat in main pana cand un PR fara legatura a iesit rosu si
# autorul a crezut ca e vina lui. Filtrul pe cai pastreaza intentia originala (nu arde
# minute pe conținut) fara sa lase main nepazit: lint-ul dureaza 2s, suita ~90s.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'ruff.toml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/editorial-quality.yml'
      - 'tools/title_quality_audit.py'
      - 'tools/qa_check.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Istoric COMPLET, nu implicitul `fetch-depth: 1`. Garda de PR fantoma din
          # tests/test_pr_fantoma.py citeste commit-urile «Merge pull request #N» de pe main ca sa
          # stie ce PR e deja integrat; masurat pe o clona `--depth 1` a repo-ului, `git log
          # --grep` intoarce ZERO merge-uri, deci garda ar trece verde fara sa masoare nimic.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      # `pytest-randomly` amesteca ordinea testelor la fiecare rulare (seed nou per rulare,
      # tiparit in antetul pytest). Motivul e concret: pe 2026-08-05 suita a dat `0 failed`
      # si `5 failed` pe acelasi cod, iar criteriul folosit atunci ca dovada de determinism —
      # „doua rulari identice" — era satisfacut SI INAINTE de fix, deci nu putea distinge nimic.
      # Ordinea aleatoare chiar poate: expune dependentele ascunse intre teste, care sunt cauza
      # obisnuita a unui astfel de rezultat bimodal.
      # Un esec se reproduce cu: python -m pytest tests/ -p randomly --randomly-seed=<seed>
      # NU intra in requirements.txt — acolo stau dependentele pipeline-ului de productie.
      # Verificat local pe seed-urile 1/2/3 inainte de a-l cabla: 570 passed de fiecare data,
      # deci NU repara nimic azi, previne maine.
      - run: pip install -r requirements.txt pytest ruff pytest-randomly
      - name: Lint (ruff — F + DTZ, configurat in ruff.toml)
        # Inaintea suitei intentionat: un import mort sau un datetime naiv se vede in 2
        # secunde, iar pytest dureaza ~90. `ruff` NU e in requirements.txt — alea sunt
        # dependentele pipeline-ului de productie, si un linter n-are ce cauta acolo.
        run: python -m ruff check .
      - run: python -m pytest tests/ -q
      - name: Contractul titlurilor oficiale
        # Regula mobilă este testată separat de randare: orice titlu oficial afișat
        # trebuie să fie nevid și să aibă cel mult 110 caractere.
        run: python tools/title_quality_audit.py

      - name: Sanatatea surselor RSS (doar la rulare manuala; PR-urile raman hermetice)
        # per sursa: HTTP / numar intrari / prospetime — prinde si feed-uri care raspund
        # 200 dar nu-s RSS. Nu ruleaza pe PR ca sa nu faca testele dependente de retea.
        # NON-BLOCANT: sanatatea feed-urilor (429 tranzitoriu, sursa moarta) NU trebuie sa
        # pice check-ul de COD "pytest". Poarta autoritara pt. feed-uri e feedcheck.yml.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/feed_check.py

  html-gate:
    # PARALEL cu `pytest`, nu dupa el. Motivul e masurat, nu estetic: randarea completa dureaza
    # ~14m40s, iar suita ~14m34s — si AMANDOUA randeaza (pytest prin fixtura `output_randat`,
    # poarta asta explicit). Serial, jobul verde de pe #244 (bd8da86) a durat 29m39s. In paralel,
    # wall-clock-ul scade la maximul celor doua, ~15 min: aceeasi munca, jumatate din asteptare.
    #
    # Randarea ramane DUBLA in mod deliberat — a face poarta sa depinda de artefactul lasat de
    # pytest ar lega-o de faptul ca un anume test a rulat, exact ce evita comentariul original.
    # Costul acelei independente e minute de runner, care sunt paralelizabili; costul dependentei
    # ar fi o poarta care tace cand fixtura nu ruleaza, care nu e.
    #
    # Numele jobului `pytest` NU s-a schimbat, ca sa nu se rupa un check obligatoriu care il
    # numeste; asta e un job NOU, adaugat langa el.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # `fetch-depth` implicit (1) e suficient AICI: istoricul complet il cere doar garda de
          # PR fantoma, care ruleaza in jobul `pytest`. Un checkout superficial e si mai rapid.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      # Doar dependentele pipeline-ului: jobul asta nu ruleaza teste, deci nu-i trebuie
      # pytest/ruff/pytest-randomly.
      - run: pip install -r requirements.txt
      - name: Poarta HTML pe output-ul construit
        # `qa_check.py` auditeaza DATELE; nimic nu se uita la HTML-ul rezultat, deci o regresie
        # de sablon care sparge o legatura interna sau scoate un `alt` ajungea pe live si se
        # vedea abia in Search Console.
        # Praguri ZERO pe toate categoriile — nu sunt alese, sunt starea masurata a lui main la
        # cablare: 2921 de pagini, 118791 de legaturi, 5116 imagini, 0 probleme.
        run: |
          python -m generator.main --render-only
          python tools/html_check.py
