name: tests

# Suita minima pytest si verificarile de output. Ruleaza pe PR-uri fara filtru de cai, ca orice
# schimbare de cod/config/sablon/reguli sa aiba aceeasi poarta. Push-ul in main ramane filtrat pentru
# a nu rula suita grea pe commituri automate care ating doar data/*.json.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']
    paths:
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - '**.json'
      - '**.jsonc'
      - '**.md'
      - '**.css'
      - '**.html'
      - '**.js'
      - 'moderation.yaml'
      - 'requirements.txt'
      - 'ruff.toml'
      - 'wrangler.jsonc'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt pytest ruff pytest-randomly
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Contractul titlurilor oficiale
        run: python tools/title_quality_audit.py
      - name: Sanatatea surselor RSS (manual)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/feed_check.py

  html-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Poarta HTML pe output-ul construit
        env:
          # Randarea trebuie SA PICA daca indexul de cautare nu se construieste. In productie
          # e invers dinadins (un index lipsa inseamna cautare simplificata, nu site jos —
          # generator/pagefind_index.py); aici, un esec tacut ar ajunge pe live si s-ar vedea
          # abia cand un cititor cauta ceva si nu gaseste nimic.
          PAGEFIND_STRICT: "1"
        run: |
          python -m generator.main --render-only
          python -m generator.pagefind_index --verify output
          python tools/html_check.py
