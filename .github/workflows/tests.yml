name: tests

# Suita minima pytest (functii pure: util/state/cluster/config). Ruleaza pe PR-uri
# si manual -- NU pe commit-urile de continut la 2h (ating doar data/*.json).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      # `pytest-randomly` amesteca ordinea testelor la fiecare rulare (seed nou per rulare,
      # tiparit in antetul pytest). Motivul e concret: pe 2026-08-05 suita a dat `0 failed`
      # si `5 failed` pe acelasi cod, iar criteriul folosit atunci ca dovada de determinism —
      # „doua rulari identice" — era satisfacut SI INAINTE de fix, deci nu putea distinge nimic.
      # Ordinea aleatoare chiar poate: expune dependentele ascunse intre teste, care sunt cauza
      # obisnuita a unui astfel de rezultat bimodal.
      # Un esec se reproduce cu: python -m pytest tests/ -p randomly --randomly-seed=<seed>
      # NU intra in requirements.txt — acolo stau dependentele pipeline-ului de productie.
      # Verificat local pe seed-urile 1/2/3 inainte de a-l cabla: 570 passed de fiecare data,
      # deci NU repara nimic azi, previne maine.
      - run: pip install -r requirements.txt pytest ruff pytest-randomly
      - name: Lint (ruff — F + DTZ, configurat in ruff.toml)
        # Inaintea suitei intentionat: un import mort sau un datetime naiv se vede in 2
        # secunde, iar pytest dureaza ~90. `ruff` NU e in requirements.txt — alea sunt
        # dependentele pipeline-ului de productie, si un linter n-are ce cauta acolo.
        run: python -m ruff check .
      - run: python -m pytest tests/ -q
      - name: Sanatatea surselor RSS (doar la rulare manuala; PR-urile raman hermetice)
        # per sursa: HTTP / numar intrari / prospetime — prinde si feed-uri care raspund
        # 200 dar nu-s RSS. Nu ruleaza pe PR ca sa nu faca testele dependente de retea.
        # NON-BLOCANT: sanatatea feed-urilor (429 tranzitoriu, sursa moarta) NU trebuie sa
        # pice check-ul de COD "pytest". Poarta autoritara pt. feed-uri e feedcheck.yml.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/feed_check.py
