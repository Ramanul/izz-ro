name: visual-live

# Verificare VIZUALA pe izz.ro cu browser real (Playwright/Chromium) -- complementul
# "as a user" al smoke-live (care e doar urllib pe HTML). Masoara stiluri calculate +
# pixeli reali dupa deploy: placeholder-ul cardurilor nu e negru, arta se randeaza,
# fara erori CSP. La FAIL, GitHub anunta owner-ul. Ruleaza rar (job cu browser e greu)
# + la cerere (workflow_dispatch, declansat dupa un deploy pentru confirmare "pe live").

on:
  push:
    branches: [main]
    paths:
      - "static/harta-stiri/**"
      - "tools/visual_check.py"
      - ".github/workflows/visual.yml"
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Originea verificata (gol = variabila de repo ALT_ORIGIN)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-live
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      # Pinat: nepinnat, Chromium se schimba sub noi de la o rulare la alta, deci un
      # esec nu mai e reproductibil. 1.62.0 e versiunea pe care CI o instala oricum
      # pe 2026-08-05. Ridica-l deliberat, nu din intamplare.
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m playwright --version
      - name: Verificare vizuala pe live
        env:
          # De ce pages.dev si nu izz.ro: zona izz.ro are bot challenge Cloudflare activ,
          # asa ca un Chromium automat primeste "Performing security verification" in loc
          # de site -- asta a tinut jobul rosu 77 de rulari (17 iul - 5 aug 2026). Originea
          # de build (pages.dev pe Pages, workers.dev pe Workers -- variabila de repo
          # ALT_ORIGIN) serveste ACELASI build, fara regulile WAF ale zonei, si tot ce masoara
          # garda (stiluri calculate, randare imagini, overflow mobil, CSP, assets) -- toate
          # vin din build, nu din WAF. Ce NU mai acopera: stratul Cloudflare al zonei
          # publice. Solutia completa e o regula WAF "Skip" pe un header secret trimis de
          # aici, dar aia cere dashboardul Cloudflare, deci e decizia proprietarului.
          # Acoperirea pe originea publica ramane la smoke-live (urllib, netul nu-l blocheaza).
          BASE_URL: ${{ inputs.base_url || vars.ALT_ORIGIN || 'https://izz-ro.pages.dev' }}
          SHOT_DIR: shots
        run: python tools/visual_check.py
      - name: Urca screenshot-urile (dovada vizuala, si la esec)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-shots
          path: shots/
          if-no-files-found: ignore
