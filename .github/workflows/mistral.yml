name: Mistral

# @mistralai — declanșat din GitHub, ca @claude. Scrii @mistralai pe un issue/PR
# → instalează mistral-vibe CLI (PyPI, de la Mistral oficial) → rulează vibe --prompt
# → comite pe branch mistral/... → deschide PR. Fără dependență de pachet terț.
#
# Poarta de securitate (oglindește claude.yml): doar OWNER/COLLABORATOR poate declanșa.
# Fără ea, oricine cu cont GitHub ar putea porni API calls plătite pe acest repo public.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mistral-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  mistral:
    # Gate: textul conține @mistralai ȘI actorul e OWNER sau COLLABORATOR.
    # Ambele condiții necesare. Fără a doua, un stranger declanșează job cu contents: write.
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@mistralai')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@mistralai')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@mistralai')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && contains(github.event.issue.body, '@mistralai')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # vibe are nevoie de istoric git pentru context

      - name: Configure git identity
        run: |
          git config user.name "mistral[bot]"
          git config user.email "mistral[bot]@users.noreply.github.com"

      - name: Setup Python + uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install mistral-vibe CLI
        run: uv tool install mistral-vibe

      - name: Assemble prompt from GitHub context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mistral-prompt

          PROMPT_FILE="/tmp/mistral-prompt/task.md"
          {
            echo "# Task (triggered by @mistralai)"
            echo ""
            echo "Repository: $REPO"
            echo "Event: $EVENT_NAME"
            echo ""

            # Adaugă instrucțiunile de proiect dacă există
            for f in AGENTS.md CLAUDE.md .github/AGENTS.md; do
              if [ -f "$f" ]; then
                echo "## Project instructions ($f)"
                echo ""
                cat "$f"
                echo ""
                echo "---"
                echo ""
              fi
            done

            # Contextul evenimentului: issue/PR + comentariul care a declanșat
            if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
              COMMENT_URL="${{ github.event.comment.html_url }}"
              COMMENT_BODY="${{ github.event.comment.body }}"
              echo "## Triggering comment"
              echo ""
              echo "From: ${{ github.event.comment.user.login }}"
              echo "URL: $COMMENT_URL"
              echo ""
              echo "$COMMENT_BODY"
              echo ""
            fi

            if [ "$EVENT_NAME" = "issues" ]; then
              echo "## Issue"
              echo ""
              echo "Title: ${{ github.event.issue.title }}"
              echo "URL: ${{ github.event.issue.html_url }}"
              echo ""
              echo "${{ github.event.issue.body }}"
              echo ""
            fi

            echo "## Instructions"
            echo ""
            echo "You are working on the repository above. Follow AGENTS.md/CLAUDE.md strictly."
            echo "Make the requested changes, run tests if applicable, then commit and push."
            echo "Never commit directly to main — work on the current branch."
            echo "Never touch data/articles.json or moderation.yaml by hand."
            echo ""

          } > "$PROMPT_FILE"

          echo "Prompt assembled ($(wc -c < "$PROMPT_FILE") bytes) at $PROMPT_FILE"
          echo "--- Prompt preview (first 500 chars) ---"
          head -c 500 "$PROMPT_FILE"

      - name: Create branch (never commit on main)
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="mistral/issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "BRANCH_NAME=$BRANCH" >> "$GITHUB_ENV"

      - name: Run Mistral Vibe (headless, auto-approve)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PROMPT_FILE: /tmp/mistral-prompt/task.md
        run: |
          set -euo pipefail
          # vibe --prompt are limită ARG_MAX; citim prompt-ul din fișier.
          # --trust: acordă încredere directorului (necesar în CI, altfel cere confirmare interactivă)
          # Modul programatic cade automat pe auto-approve (vede docs.mistral.ai/vibe/code/cli)
          vibe --trust --prompt "$(cat "$PROMPT_FILE")" --max-turns 30 --output text

      - name: Commit + push changes
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::vibe nu a schimbat niciun fișier"
            exit 0
          fi
          git commit -m "feat(@mistralai): changes from @mistralai trigger"
          git push origin HEAD

      - name: Open PR (from issue/comment)
        if: env.BRANCH_NAME != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          gh pr create \
            --head "$BRANCH_NAME" \
            --base main \
            --title "Resolves issue #${ISSUE_NUMBER} (@mistralai)" \
            --body "Generated by @mistralai from issue #${ISSUE_NUMBER}." \
            --label "mistral"

      - name: Report result on issue/PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -z "$NUMBER" ]; then
            echo "nu pot determina issue/PR number — sar peste comentariul de status"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "$NUMBER" --body "✅ @mistralai a terminat. Vezi commit-urile / PR-ul de mai sus."
          else
            gh issue comment "$NUMBER" --body "❌ @mistralai a eșuat. Verifică [logurile](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
