name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Rularea programata NU e redundanta cu push-ul in main, si de-aia exista.
  #
  # Masurat 2026-09-14 pe ultimele 19 rulari `ci.yml` incheiate pe main: 10 ROSII. O parte
  # dintre ele au aparut FARA niciun commit vinovat — garzile citesc `data/articles.json`,
  # pe care pipeline-ul il rescrie la fiecare rulare. Iar commiturile de continut sunt
  # impinse cu `GITHUB_TOKEN`-ul implicit, care prin regula GitHub NU declanseaza niciun
  # workflow. Deci main putea deriva in rosu si sta asa pana cand deschidea cineva un PR,
  # iar PR-ul aparea vinovat.
  #
  # Ora: 05:17 UTC, deliberat in afara varfului de `schedule` (:00), unde planificatorul
  # GitHub sare cel mai des firings.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: tests + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      # Poarta pentru garzile de stare partajata e in `tests/poarta_stare.py`, nu aici:
      # aceeasi suita e pornita si din `tests.yml`, iar o regula scrisa in doua YAML-uri se
      # desincronizeaza — exact defectul reparat de commitul asta in ALT_ORIGIN.
      - name: Pytest
        run: python -m pytest -q
      - name: Grounding gate contract (clean evidence)
        env:
          IZZ_RAPORT_COPIERE_GATE: ${{ runner.temp }}/grounding-contract.jsonl
        run: |
          printf '%s\n' '{"id":"ci-contract","model":"test","blocking_issues":[],"advisory_issues":[]}' > "$IZZ_RAPORT_COPIERE_GATE"
          python tools/grounding_gate.py
