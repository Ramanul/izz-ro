name: scrape-probe

# Monitor Local: descopera selectoarele (tag.class) pentru o pagina de anunturi de
# primarie, ca sa poata fi adaugata ca sursa html_list. Rulat manual, cu URL-ul ca input.
# Runnerii au internet (sandbox-ul de dev nu). Nu scrie nimic, nu consuma AI quota.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL-ul paginii de anunturi (ex. https://primaria-x.ro/anunturi)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          case "$TARGET_URL" in
            http://*|https://*) ;;
            *) echo "::error::URL-ul trebuie să înceapă cu http:// sau https://"; exit 1 ;;
          esac
          python tools/scrape_probe.py "$TARGET_URL"
