name: smoke-live

# Verifica SITE-UL LIVE dupa fiecare ciclu de deploy: regulile de format ale
# ownerului (CLAUDE.md sectiunea 7) trebuie sa fie vizibile pe izz.ro, nu doar in cod.
# Pipeline-ul ruleaza la :00 -> deploy ~:05-:10 -> smoke la :45. La FAIL, GitHub
# anunta ownerul automat.

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch: {}
  # Smoke IMEDI dupa fiecare deploy reusit de pe main (nu doar la :45, care poate prinde
  # deploy-ul din plin — cronul de deploy e la :53). Cronul ramane ca watchdog periodic.
  workflow_run:
    workflows: ["deploy-worker"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # La workflow_run: ruleaza doar dupa deploy SUCCES de pe main (ignora rulari picate sau
    # declansate de alte branch-uri). Cronul si dispatch-ul raman neatinse.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python tools/smoke_live.py
        env:
          BASE_URL: https://izz.ro
