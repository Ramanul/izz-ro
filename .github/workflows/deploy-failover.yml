name: deploy-failover

# Publicare pe Worker-ul izz-failover, rezerva pentru revenire (infra/README-failover.md).
# Din 2026-10-31 worker-ul nu mai are ruta: izz.ro/* sta pe izz-ro (wrangler.jsonc). Rularea e
# DOAR manuala, fiindca trigger-ul pe infra/** ar republica un worker fara trafic la fiecare
# schimbare a Workerului izz-ro, cu tot cu secretul de deploy.
# Istoric delicat: deploys vechi au picat pe migrari DO (cod 10064) — tag-ul din wrangler.toml
# e deja aplicat live, deci re-deploy cu aceeasi sursa e no-op.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-failover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Poarta - doar main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Failover-ul se publică doar de pe main (acum $REF). Dispatch-ul de pe alt branch rulează workflow-ul de pe branch, cu secretul de deploy."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Semnatura failover (constante critice prezente)
        run: |
          set -euo pipefail
          grep -q 'PRIMARY = "https://' infra/failover-worker.js
          grep -q 'MIRROR = "https://' infra/failover-worker.js
          grep -q 'PRIMARY_TIMEOUT_MS' infra/failover-worker.js
          if grep -q '^routes' infra/wrangler.toml; then
            echo "::error::infra/wrangler.toml declara rute; izz.ro/* trebuie sa ramana pe izz-ro"
            exit 1
          fi
          echo "semnatura OK"

      - name: Publica izz-failover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.125.0 deploy --config infra/wrangler.toml
