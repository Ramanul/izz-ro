name: codeql

# Subagent de securitate (cu guard): scaneaza codul Python si ridica alerte in
# tab-ul Security; nu modifica nimic singur. Gratuit pe repo public.
# Ruleaza pe PR + saptamanal -- NU pe fiecare commit de continut (la 2h), ca sa
# nu iroseasca minute Actions (commit-urile bot ating doar data/*.json, nu cod).

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"   # luni, 04:27 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # init si analyze TREBUIE sa fie pe acelasi SHA: versiuni diferite ale lui
      # codeql-action in acelasi job => "CodeQL job status was configuration error".
      # De-asta sunt grupate in dependabot.yml (vezi grupul codeql-action).
      - name: Init CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
