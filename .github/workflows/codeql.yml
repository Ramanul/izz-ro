name: codeql

# Subagent de securitate (cu guard): scaneaza codul Python si ridica alerte in
# tab-ul Security; nu modifica nimic singur. Gratuit pe repo public.
# Ruleaza pe PR + saptamanal -- NU pe fiecare commit de continut (la 2h), ca sa
# nu iroseasca minute Actions (commit-urile bot ating doar data/*.json, nu cod).

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"   # luni, 04:27 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Init CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
