name: harta-stiri-smoke

# Smoke validation for the public Cloudflare Pages build.

# Zero drepturi: jobul face doar `curl` catre pages.dev si `node --check`, deci nu atinge
# niciodata `GITHUB_TOKEN`. Fara blocul asta primea permisiunile IMPLICITE ale repo-ului —
# posibil write pe cod, pentru un job care n-are ce scrie. Era singurul din cele 19 workflow-uri
# fara `permissions` declarat (audit 2026-08-20, [W1]).
permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "static/harta-stiri/data/map.json"
      - "static/harta-stiri/harta-stiri.js"
      - ".github/workflows/harta-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Așteaptă propagarea deploy-ului Cloudflare
        run: sleep 20
      - name: Verifică pagina și datasetul hărții pe pages.dev
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            page=$(curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.html -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/ || true)
            data=$(curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.json -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/data/map.json || true)
            js=$(curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.js -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/harta-stiri.js || true)
            echo "încercarea $i: page=$page data=$data js=$js"
            if [ "$page" = "200" ] && [ "$data" = "200" ] && [ "$js" = "200" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/map.json').read_text(encoding='utf-8'))
          counties = data['map']['judete']
          articles = data.get('articles') or []
          stats = data.get('stats') or {}
          # Harta are TREI niveluri, nu doua. Un articol `regional` e ancorat de regiune si
          # primeste deliberat `county: ""` (tools/build_harta_data.py, ramura `category ==
          # "regional"`), fiindca regiunea nu e continuta intr-un singur judet. Versiunea
          # anterioara a acestui bloc presupunea doar local+judetean, deci pica pe orice
          # dataset cu macar un articol regional: pe 21 aug erau 2 din 548, si garda statea
          # rosie din 20 aug 18:15. O garda rosie permanent nu mai semnaleaza nimic.
          # Fiecare `assert` are mesaj: log-ul precedent nu spunea decat "linia 10".
          niveluri = ('local', 'judetean', 'regional')
          assert data['map']['viewbox'], 'harta publica nu are viewbox'
          assert len(counties) == 42, f'{len(counties)} judete in dataset, asteptat 42'
          assert articles, 'datasetul public nu contine articole localizate'
          fara_judet = [a for a in articles
                        if a.get('geo_level') != 'regional' and a.get('county') not in counties]
          assert not fara_judet, (
              f'{len(fara_judet)} articole ne-regionale au judet necunoscut; '
              f'primul: {fara_judet[0].get("slug")!r} judet={fara_judet[0].get("county")!r}')
          # Reversul: un articol regional TREBUIE sa aiba regiune si sa NU aiba judet. Fara
          # asta, verificarea de mai sus s-ar putea ocoli punand `regional` pe orice.
          regional_stricat = [a for a in articles if a.get('geo_level') == 'regional'
                              and (a.get('county') or not a.get('region'))]
          assert not regional_stricat, (
              f'{len(regional_stricat)} articole regionale cu judet pus sau fara regiune; '
              f'primul: {regional_stricat[0].get("slug")!r}')
          assert stats.get('total') == len(articles), (
              f'stats.total={stats.get("total")} dar datasetul are {len(articles)} articole')
          judete_distincte = len({a['county'] for a in articles if a.get('county')})
          assert stats.get('counties') == judete_distincte, (
              f'stats.counties={stats.get("counties")} dar articolele acopera '
              f'{judete_distincte} judete (judetul gol al regionalelor nu se numara)')
          suma = sum(stats.get(n, 0) for n in niveluri)
          assert suma == len(articles), (
              f'nivelurile insumeaza {suma} dar sunt {len(articles)} articole: '
              + ', '.join(f'{n}={stats.get(n, 0)}' for n in niveluri))
          assert stats.get('coordinates', 0) <= len(articles), (
              f'stats.coordinates={stats.get("coordinates")} > {len(articles)} articole')
          print('OK:', len(articles), 'articole in', judete_distincte, 'judete —',
                ', '.join(f'{n}={stats.get(n, 0)}' for n in niveluri))
          PY
              then
                node --check /tmp/map.js
                echo 'Smoke test public hartă: OK'
                exit 0
              fi
              echo 'Răspunsul public este încă vechi/incoerent; reîncerc după propagare.'
            fi
            sleep 20
          done
          echo 'Deploy-ul public nu a propagat o versiune coerentă a hărții în timpul smoke testului.'
          exit 1