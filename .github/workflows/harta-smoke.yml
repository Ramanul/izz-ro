name: harta-stiri-smoke

on:
  push:
    branches: [main]
    paths:
      - "static/harta-stiri/data/map.json"
      - "static/harta-stiri/harta-stiri.js"
      - ".github/workflows/harta-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Așteaptă propagarea deploy-ului Cloudflare
        run: sleep 20
      - name: Verifică pagina hărții și datasetul public
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            page=$(curl -fsSL -o /tmp/map.html -w '%{http_code}' https://izz.ro/static/harta-stiri/ || true)
            data=$(curl -fsSL -o /tmp/map.json -w '%{http_code}' https://izz.ro/static/harta-stiri/data/map.json || true)
            js=$(curl -fsSL -o /tmp/map.js -w '%{http_code}' https://izz.ro/static/harta-stiri/harta-stiri.js || true)
            echo "încercarea $i: page=$page data=$data js=$js"
            if [ "$page" = "200" ] && [ "$data" = "200" ] && [ "$js" = "200" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/map.json').read_text(encoding='utf-8'))
          assert data['map']['viewbox']
          assert len(data['map']['judete']) >= 40
          assert data['articles'], 'datasetul public nu conține articole localizate'
          assert all(a['county'] in data['map']['judete'] for a in data['articles'])
          print('OK:', len(data['articles']), 'articole localizate,', len(data['map']['judete']), 'județe')
          PY
              exit 0
            fi
            sleep 20
          done
          echo 'Deploy-ul public nu a propagat harta în timpul smoke testului.'
          exit 1
