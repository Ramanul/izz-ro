name: editorial-quality

# Audit determinist, fără agent și fără servicii AI. Verifică zilnic corpusul aflat pe
# main; la fiecare actualizare de conținut, același contract este verificat și de
# tools/qa_check.py din pipeline-ul principal.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title-contract:
    name: Contractul titlurilor oficiale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Verifică limita mobilă și generează raportul
        run: python tools/title_quality_audit.py --report title-quality-report.json
      - name: Păstrează raportul de audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: title-quality-report
          path: title-quality-report.json
          if-no-files-found: error
          retention-days: 30

  publication-quality:
    name: Calitatea corpusului publicabil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python tools/qa_check.py
