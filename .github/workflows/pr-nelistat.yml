# Garda inversa: un PR deschis de peste 24h nu poate lipsi din specs/STATE.md.
#
# De ce un workflow separat si nu un pas in tests.yml: are nevoie de `pull-requests: read`,
# iar tests.yml ruleaza cu `contents: read` si trebuie sa ramana hermetic (fara retea).
# Incidentul: PR #253, verde 30h, absent din STATE.md — proprietarul a citit STATE.md si a
# crezut ca munca s-a pierdut.
name: pr-nelistat

on:
  pull_request:
  schedule:
    # Zilnic la 05:20 UTC. Cazul real nu era un PR nou, ci unul UITAT — deci garda trebuie
    # sa sune si cand nu se intampla nimic, nu doar cand cineva deschide un PR.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-nelistat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PR-urile deschise apar in STATE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_CURENT: ${{ github.event.pull_request.number }}
        run: python tools/pr_nelistat.py
