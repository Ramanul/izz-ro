name: detectie-tacere

# PLAN UNIFICAT #10: un cron mort arată din afară identic cu un sistem sănătos. Unelta
# verifică CABLAJUL (ultimele rulări ale workflow-urilor programate + ultimul commit de
# conținut), nu site-ul public. La tăcere deschide/actualizează un issue; la revenire îl
# închide. Este singurul workflow cu issues: write și nu atinge conținutul.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: detectie-tacere
  cancel-in-progress: false

jobs:
  verificare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verifica tacerea
        id: verificare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/detectie_tacere.py
      - name: Deschide sau actualizeaza alerta
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NR=$(gh issue list --state open --search "ALERTA tacere pipeline in:title" --json number --jq '.[0].number')
          if [ -z "$NR" ]; then
            gh issue create --title "ALERTA tacere pipeline" --body-file alerta.md
          else
            gh issue edit "$NR" --body-file alerta.md
          fi
      - name: Inchide alerta la revenire
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for NR in $(gh issue list --state open --search "ALERTA tacere pipeline in:title" --json number --jq '.[].number'); do
            gh issue close "$NR" --comment "Tacere rezolvata: toate mecanismele au rulat in plafon."
          done
