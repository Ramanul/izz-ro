name: trafic

# DE CE MANUAL, nu programat: e o SONDA, nu un monitor. Intrebarea careia raspunde —
# "are tokenul existent scope de analytics?" — se pune o data, nu la fiecare ora. Daca
# raspunsul e da si datele devin utile, ATUNCI se discuta o cadenta; pana atunci un cron
# ar consuma minute de runner pentru nimic (CLAUDE.md sect. 19: costul pe felie).
#
# Rulat de aici fiindca `api.cloudflare.com` e refuzat de proxy-ul de agent dintr-o sesiune
# remote (IZZ-0252), dar runnerul de Actions ajunge la el. Al patrulea canal din sect. 12a.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trafic:
    name: Cate cereri primeste izz.ro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Fara `pip install`: scriptul foloseste doar biblioteca standard, deliberat.
      - name: Interogheaza Cloudflare GraphQL Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/trafic_cloudflare.py
