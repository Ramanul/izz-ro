name: uptime-monitor

# Detectie externa, independenta de infrastructura de servire (ruleaza pe GitHub, la 10 min).
#
# Sonda verifică markerul de conținut și data ultimului articol, nu doar statusul.
# Challenge-ul anti-bot/rețeaua indisponibilă = rezultat neconcludent (warning), niciodată
# «sănătos». 5xx, conținut străin sau înghețat = error. Redundanța cere cel puțin o origine
# de rezervă cu conținut proaspăt verificat. Workflow-ul rămâne în starea setată de proprietar;
# acest patch nu îl reactivează autonom.

on:
  schedule:
    # ATENTIE la ce inseamna */10 aici: e o CERERE, nu o garantie. Masurat 2026-08-05, pe 6
    # rulari consecutive, intervalele reale au fost 62-200 min -- adica ~5% din cadenta ceruta.
    # Planificatorul GitHub sare firings de `schedule`, iar intervalele scurte sunt cele mai
    # afectate. Fereastra reala de detectie a unui outage e deci de ordinul ORELOR, nu 10 min.
    # NU rari cron-ul ca sa "fie sincer": cererea deasa maximizeaza ce livreaza GitHub, iar
    # rarirea ar reduce si mai mult frecventa reala. Detectia sub-ora cere un serviciu extern
    # (Cloudflare Health Checks / UptimeRobot) -- decizie de cont, nu de repo.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Conținut public + prospețime (nu doar status 200)
        env:
          ALT_ORIGIN: ${{ vars.ALT_ORIGIN || 'https://izz-ro.andifreelancer2.workers.dev' }}
        run: |
          case "$ALT_ORIGIN" in
            https://izz-ro.andifreelancer2.workers.dev|https://izz.ro) ;;
            *) echo "::error::ALT_ORIGIN necunoscut: $ALT_ORIGIN"; exit 1 ;;
          esac
          probe_site() {
            set +e
            python tools/public_probe.py "$1"
            result=$?
            set -e
            echo "$result"
          }
          PUB=$(probe_site https://izz.ro)
          PRI=$(probe_site "$ALT_ORIGIN")
          MIR=$(probe_site https://ramanul.github.io)
          crit=0
          # 1 = eroare/conținut înghețat; 2 = challenge/rețea, neconcludent.
          [ "$PUB" = "1" ] && { echo "::error::izz.ro are o eroare reală sau conținut înghețat"; crit=1; }
          [ "$PUB" = "2" ] && echo "::warning::izz.ro neconcludent pentru runner; nu declarăm site-ul sănătos"
          if [ "$PRI" != "0" ] && [ "$MIR" != "0" ]; then
            echo "::error::nicio origine de rezervă nu a livrat conținut proaspăt verificat"
            crit=1
          elif [ "$PRI" != "0" ]; then
            echo "::warning::originea primară nu e verificată; mirror-ul livrează"
          elif [ "$MIR" != "0" ]; then
            echo "::warning::mirror-ul nu e verificat; redundanță degradată"
          fi
          exit "$crit"
