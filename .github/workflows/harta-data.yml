name: harta-stiri-data

on:
  push:
    branches:
      - main
      - feature/harta-stiri
    paths:
      - "data/articles.json"
      - "data/harta_judete.json"
      - "data/siruta_raw.csv"
      - "tools/build_harta_data.py"
      - "tools/build_harta_localitati.py"
      - "static/harta-stiri/harta-stiri.js"
      - ".github/workflows/harta-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harta-stiri-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Fixate pe SHA, ca restul workflow-urilor. Fisierul asta era singurul ramas pe tag-uri
      # moi (`@v7`, `@v4`), iar un tag se poate muta sub noi fara sa se schimbe nimic in diff.
      # Conteaza aici in mod special: jobul are `contents: write` si comite datasetul hartii.
      # `setup-node` era si vechi (v4); ridicat la v7 in aceeasi trecere (dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verifica sintaxa frontend-ului hărții
        run: node --check static/harta-stiri/harta-stiri.js

      - name: Descarca si precompileaza coordonatele localitatilor
        run: python tools/build_harta_localitati.py

      - name: Genereaza datasetul hărții
        run: python tools/build_harta_data.py

      - name: Valideaza datasetul și coordonatele hărții
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('static/harta-stiri/data/map.json').read_text(encoding='utf-8'))
          points = json.loads(Path('data/harta_localitati.json').read_text(encoding='utf-8'))
          counties = data['map']['judete']
          articles = data['articles']
          stats = data['stats']
          assert len(counties) == 42, len(counties)
          assert articles, 'Nu există articole localizate.'
          assert data.get('version', 0) >= 3
          assert data.get('generated_at')
          assert data.get('latest_article_at')
          assert stats['total'] == len(articles)
          assert stats['local'] + stats['judetean'] == len(articles)
          assert stats['counties'] == len({a['county'] for a in articles})
          named_localities = {a.get('siruta') or f"{a.get('locality')}|{a.get('county')}" for a in articles if a.get('locality')}
          assert stats['localities'] == len(named_localities)
          assert stats['county_only'] == sum(not a.get('locality') for a in articles)
          assert stats['coordinates'] == sum(a.get('x') is not None and a.get('y') is not None for a in articles)
          assert stats['geocoded_localities'] <= stats['localities']
          assert stats['events'] == len({a.get('event_id') for a in articles})
          assert points['localities'], 'Nu există puncte de localități.'
          for key, p in points['localities'].items():
              assert 0 <= float(p['x']) <= 1000, (key, p['x'])
              assert 0 <= float(p['y']) <= 703.53, (key, p['y'])
          for a in articles:
              assert a['county'] in counties, a['county']
              if a.get('x') is not None or a.get('y') is not None:
                  assert a.get('x') is not None and a.get('y') is not None, a
                  assert 0 <= float(a['x']) <= 1000, a
                  assert 0 <= float(a['y']) <= 703.53, a
              if a.get('siruta'):
                  assert a.get('locality'), a
          print(f"OK: {len(articles)} articole, {stats['events']} evenimente, {stats['localities']} localități confirmate, {stats['coordinates']} coordonate")
          PY

      - name: Publica dataseturile dacă s-au schimbat
        run: |
          set -euo pipefail
          git config user.name "izz-bot"
          git config user.email "bot@izz.ro"
          git add data/harta_localitati.json static/harta-stiri/data/map.json
          if git diff --cached --quiet; then
            echo "Dataseturile hărții sunt deja sincronizate."
            exit 0
          fi
          git commit -m "build(map): update locality-aware news map dataset"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              if git push origin HEAD:main; then
                echo "Dataseturile hărții au fost publicate."
                exit 0
              fi
            else
              echo "Remote-ul a avansat; rebasez peste origin/main înainte de push."
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Dataseturile hărții au fost publicate după rebase."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push eșuat (încercarea $attempt/5); reîncerc în 10 secunde..."
              sleep 10
            fi
          done
          echo "Push-ul a eșuat după 5 încercări."
          exit 1

  public-smoke:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Așteaptă propagarea deploy-ului Cloudflare
        run: sleep 30
      - name: Verifică versiunea publică a hărții
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            page=$(curl -A 'Mozilla/5.0' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.html -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/ || true)
            data=$(curl -A 'Mozilla/5.0' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.json -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/data/map.json || true)
            js=$(curl -A 'Mozilla/5.0' --connect-timeout 5 --max-time 10 -fsSL -o /tmp/map.js -w '%{http_code}' https://izz-ro.pages.dev/static/harta-stiri/harta-stiri.js || true)
            echo "încercarea $i: page=$page data=$data js=$js"
            if [ "$page" = "200" ] && [ "$data" = "200" ] && [ "$js" = "200" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/map.json').read_text(encoding='utf-8'))
          assert len(d['map']['judete']) == 42
          assert d.get('articles')
          assert d.get('version', 0) >= 3
          assert d.get('generated_at') and d.get('latest_article_at')
          assert d['stats']['total'] == len(d['articles'])
          assert d['stats']['events'] == len({a.get('event_id') for a in d['articles']})
          assert d['stats']['coordinates'] <= d['stats']['total']
          for a in d['articles']:
              if a.get('x') is not None:
                  assert a.get('y') is not None
                  assert 0 <= float(a['x']) <= 1000 and 0 <= float(a['y']) <= 703.53
          print('Dataset public coerent:', d['stats'])
          PY
              then
                node --check /tmp/map.js
                echo 'Smoke test public hartă: OK'
                exit 0
              fi
            fi
            sleep 20
          done
          echo 'Deploy-ul public nu a propagat o versiune coerentă a hărții.'
          exit 1