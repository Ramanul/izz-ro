name: ua-probe

# De ce dau 429 unele feed-uri de pe runnerii GitHub: User-Agent-ul sau IP-ul?
# Rulat manual. Runnerii au IP-ul care primeste 429; masina de acasa nu — de aia se
# ruleaza aici. Nu scrie nimic, nu consuma AI quota.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Chei din config.SOURCES, separate prin spatiu (gol = libertatea unica elle bzi)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          KEYS: ${{ inputs.keys }}
        run: |
          set -euo pipefail
          if [ -n "$KEYS" ]; then
            case "$KEYS" in
              *[!A-Za-z0-9_\ -]*) echo "::error::chei invalide — doar litere, cifre, _ și spațiu"; exit 1 ;;
            esac
          fi
          # Impărțirea pe spații e intenționată (câte o cheie). Validarea de mai sus
          # a scos metacaracterele; valoarea vine din env, nu interpolată în script.
          # shellcheck disable=SC2086
          python tools/ua_probe.py $KEYS
