name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude review
        if: env.HAS_TOKEN == 'true'
        # Non-blocking on purpose. The reviewer runs on the owner's Claude quota, and when that
        # quota is spent the action fails before inference (measured on PR #88: duration 427ms,
        # total_cost_usd 0, num_turns 1, zero permission denials — nothing was billed because
        # nothing ran). That is an external condition no code change fixes, and a check that
        # goes red for external reasons stops being read — the same reasoning feedcheck uses for
        # 429s (LIMIT, not DEAD) and monitor.yml for edge 403s. The step still shows a warning,
        # so a real reviewer failure is visible; it just no longer gates every PR in the repo.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Focus on correctness, security, and missed
            edge cases. Post your review as a PR comment ending with a single
            verdict line: "VERDICT: APPROVE" or "VERDICT: NEEDS CHANGES",
            followed by a short numbered list of issues (if any).
            For every issue, include a concrete proposed fix (code snippet or
            diff), so the author can apply it or reply "@claude apply your
            fixes" to have you commit the changes on this branch.
          # Read/Grep/Glob are required: a reviewer asked to judge correctness must open
          # the files around the diff. Without them the run ends is_error:true after a
          # handful of permission denials (measured on PR #85: 9 turns, 5 denials).
          # Read-only by design — no Write/Edit, so the reviewer still cannot touch the branch.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'

      - name: Token missing notice
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN secret not set - skipping Claude review."
