name: revizuire

# K12 / IZZ-0255. Rezumatul zilnic de revizuire, postat ca UN COMENTARIU pe issue-ul #233.
#
# DE CE ACOLO si nu prin email/pagina: proprietarul foloseste deja issue-urile ca reminder
# care nu depinde de nicio aplicatie (o scrie explicit in #198), iar GitHub il notifica
# oricum. Zero infrastructura noua, zero secrete noi.
#
# DE CE 06:40 UTC: dupa editorial-quality.yml (06:37), ca sa nu se calce pe runner, si
# inaintea zilei de lucru.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      zi:
        description: 'Ziua de rezumat, YYYY-MM-DD (implicit: ieri)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write        # doar ca sa poata comenta pe #233

jobs:
  revizuire:
    name: Ce merita ochi de om azi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Fara pip install: scriptul foloseste doar biblioteca standard si generator.guard.
      - name: Compune rezumatul
        env:
          ZI: ${{ inputs.zi }}
        run: |
          python tools/revizuire_zilnica.py "$ZI" > rezumat.md
          cat rezumat.md
      # ORICE valoare din `${{ }}` intra prin ENV, niciodata direct in `run:` sau intr-un
      # heredoc: interpolarea in bash a fost o injectie reala in repo-ul asta, reparata in
      # #177. `github.repository` nu e controlat de utilizator, dar tiparul nu se reintroduce.
      - name: Posteaza pe issue-ul de revizuire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOZIT: ${{ github.repository }}
        run: python tools/posteaza_rezumat.py rezumat.md 233
