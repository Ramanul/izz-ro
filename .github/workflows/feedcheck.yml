name: feed-check

# Sanatatea surselor RSS, per sursa (HTTP / numar intrari / prospetime) — rulat manual
# inainte de a adauga/lasa o sursa in productie. Sandbox-urile de dev nu au internet;
# runnerii da. Nu consuma AI quota si nu scrie nimic.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python tools/feed_check.py
