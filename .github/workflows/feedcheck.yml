name: feed-check

# Sanatatea surselor RSS, per sursa (HTTP / numar intrari / prospetime).
# Ruleaza programat si manual inainte de a lasa o sursa in productie. Nu consuma AI quota si nu scrie nimic.
# Un esec de feed nu blocheaza PR-urile de cod: este un semnal operațional despre surse externe.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: feed-check
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python tools/feed_check.py
