name = "izz-failover"
main = "failover-worker.js"
compatibility_date = "2026-07-01"

# Worker-ul intercepteaza tot traficul catre apex-ul izz.ro inaintea servirii Pages.
# Fetch-urile catre izz-ro.pages.dev / ramanul.github.io sunt host-uri diferite -> fara bucla.
routes = [
  { pattern = "izz.ro/*", zone_name = "izz.ro" }
]

# Nota migrarilor (actualizata 2026-10-03): worker-ul deployat manual pe 2026-08-22 (nu din
# repo) a introdus o clasa Durable Object `RateLimiter` si un Workflow, prin dashboard. Pe
# 2026-09-01 s-a adaugat aici migrarea `deleted_classes: ["RateLimiter"]` ca sa curete clasa
# fara ca deploy-ul sa oppoare orfelinatul ei. La deploy-ul din 2026-10-03 (PR #414) Cloudflare
# a raspuns cu cod 10074: „Cannot apply delete-class migration to class 'RateLimiter' which was
# not exported in the previous version" — adica versiunea live NU mai exporta clasa (a fost
# curatata cândva intre timp), deci nu mai exista nimic de sters, iar migrarea ramasa otraveste
# orice deploy viitor. Sectiunea s-a scos complet. Daca un DO/Workflow revine vreodata in acest
# worker, migrarea se scrie iar — cu tag NOU, pentru ca migrarile vechi sunt no-op.

