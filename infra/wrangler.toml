name = "izz-failover"
main = "failover-worker.js"
compatibility_date = "2026-07-01"

# Worker-ul intercepteaza tot traficul catre apex-ul izz.ro inaintea servirii Pages.
# Fetch-urile catre izz-ro.pages.dev / ramanul.github.io sunt host-uri diferite -> fara bucla.
routes = [
  { pattern = "izz.ro/*", zone_name = "izz.ro" }
]

# Worker-ul deployat manual pe 2026-08-22 (nu din repo) a introdus o clasa Durable Object
# `RateLimiter` si un Workflow, prin dashboard. Versiunea din repo nu le exporta, iar
# Cloudflare refuza un deploy care lasa in urma o clasa DO fara migrare explicita.
# FIXAT 2026-09-01: Tag-ul s-a schimbat la "cleanup-do-lifecycle-2026-09-01" pentru a forta
# calea coreca in Cloudflare (migrari se aplica o singura data per tag; un tag vechi e no-op).
# Trei deploy-uri au picat pe cod 10064 cu tag-ul anterior; cu tag nou se aplica migrarea.
[[migrations]]
tag = "cleanup-do-lifecycle-2026-09-01"
deleted_classes = ["RateLimiter"]
