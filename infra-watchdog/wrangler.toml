# izz-watchdog — sondă gratuită la edge pentru pipeline-ul de build izz.ro.
#
# De ce există: site-ul e reconstruit de GitHub Actions, iar Actions poate
# întârzia cronurile programate cu 62-200 de minute. Asta e sonda independentă
# de la edge: rulează pe cron la 20 de minute, ia build.json de pe ambele
# origini (izz.ro + oglinda GitHub Pages), ține fail_streak-ul per origine în
# KV și scrie un WATCHDOG ALERT (console.error) în Workers Observability când o
# origine pică repetat. Gratuit: cron trigger + Observability, pe
# infrastructura existentă (namespace-ul KV „izz-kv" de mai jos).
# Nu are rute și nu servește trafic — e sondă, nu server.

name = "izz-watchdog"
main = "index.js"
compatibility_date = "2026-06-18"
workers_dev = false

# Fără asta logurile console.error (alertele) se pierd — singura suprafață de alertare.
[observability]
enabled = true

[triggers]
crons = ["*/20 * * * *"]

# Namespace-ul KV existent „izz-kv"; watchdog-ul își ține starea anterioară
# sub cheia "status" (recordul {ts, primary, public}).
[[kv_namespaces]]
binding = "WATCHDOG_KV"
id = "cd9eb1d794cd42c0aca9fcd86248f308"

# ── Paznicul de cost R2 (r2-paznic.js) ───────────────────────────────────────────────
# INERT cât timp R2_PAZNIC_BUCKET e gol: codul se poate publica fără să schimbe nimic.
# La activare: numele bucket-ului aici, apoi secretele (wrangler secret put):
#   CF_API_TOKEN_R2  — token cu „Account Analytics: Read” + „Workers R2 Storage: Edit”
#   CF_ACCOUNT_ID    — id-ul contului
#   ALERTA_DE / ALERTA_CATRE — opțional, pentru e-mail (expeditor pe izz.ro, destinatar
#                      verificat în Email Routing); fără ele alerta rămâne în loguri.
[vars]
R2_PAZNIC_BUCKET = ""

# Trimitere de e-mail prin Email Routing (gratuit). Fără adresele de mai sus nu trimite nimic.
[[send_email]]
name = "ALERTA_EMAIL"
