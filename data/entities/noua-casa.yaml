# Entitate: Programul Noua Casă
# Valorile volatile pentru un an de program trebuie verificate pe sursa oficială înainte de publicare.
id: noua-casa
nume: "Programul Noua Casă"
tip: locuinte
categorie_ghid: locuinte
categorie_stiri: economic

valoare_curenta:
  in_vigoare_de: "2009-06-17"
  act_normativ: "HG 717/2009, cu modificările și completările ulterioare"
  sursa_url: "https://www.fngcimm.ro/noua-casa"
  descriere_lunga: "Programul Noua Casă facilitează achiziția unei locuințe de către persoane fizice prin credite garantate de stat. Plafonul anual, procentele de garantare, condițiile și costurile aplicabile trebuie verificate pentru anul în curs în sursele oficiale."

sectiuni:
  - titlu: "Ce este programul?"
    continut: >-
      Programul „Noua Casă” este un program guvernamental destinat persoanelor fizice care cumpără o locuință printr-un credit garantat de stat. Condițiile concrete depind de categoria locuinței, valoarea creditului și normele aplicabile la data solicitării.
  - titlu: "Ce trebuie verificat înainte de aplicare?"
    continut: >-
      Verifică în primul rând **plafonul disponibil pentru anul curent**, **avansul minim**, **procentul de garantare**, criteriile de eligibilitate și condițiile băncii finanțatoare. Valorile istorice nu trebuie copiate automat într-o pagină pentru 2026.
  - titlu: "Unde găsești condițiile oficiale?"
    continut: >-
      Fondul Național de Garantare a Creditelor pentru IMM-uri (FNGCIMM) publică informațiile operative ale programului și documentele relevante. Pentru detalii juridice se verifică și actele normative în forma în vigoare.

faq:
  - q: "Pot folosi informațiile dintr-un an anterior ca să calculez creditul din 2026?"
    a: "Nu fără verificare. Plafonul anual și unele condiții pot fi stabilite sau modificate prin acte noi."
  - q: "Cine acordă efectiv creditul?"
    a: "Creditul este acordat de o bancă participantă, iar o parte din credit este garantată în cadrul programului de stat."
  - q: "Unde verific condițiile actuale?"
    a: "Pe pagina oficială FNGCIMM dedicată programului și în actele normative aflate în vigoare la data solicitării."

