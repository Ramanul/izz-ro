sectiuni:
  - titlu: "Este pensia minimă o categorie distinctă de pensie?"
    continut: >-
      Nu. CNPP explică faptul că indemnizația socială pentru pensionari este un ajutor cu caracter social și nu o categorie distinctă de pensie. Ea completează veniturile de pensie eligibile până la nivelul stabilit prin lege.
  - titlu: "Cât este indemnizația socială în 2026?"
    continut: >-
      În perioada **2024–2026**, nivelul este **1.281 lei**. CNPP arată aceeași valoare în tabelul oficial actualizat în august 2026.
  - titlu: "Cum se stabilește suma primită?"
    continut: >-
      Indemnizația se determină ca diferență între nivelul legal de **1.281 lei** și cuantumul însumat al veniturilor eligibile luate în calcul, în condițiile prevăzute de legislație. Nu trebuie confundată cu pensia calculată pe baza contributivității.

faq:
  - q: "Cât este pensia minimă în 2026?"
    a: "Nivelul indemnizației sociale pentru pensionari este de 1.281 lei în 2026, potrivit CNPP."
  - q: "Este indemnizația socială aceeași cu pensia mea calculată?"
    a: "Nu. Este un ajutor social care poate completa veniturile de pensie eligibile până la pragul stabilit prin lege."
  - q: "Se aplică tuturor pensionarilor la fel?"
    a: "Eligibilitatea și cuantumul efectiv depind de categoria de pensionar și de veniturile care intră în calculul prevăzut de legislație. Pentru cazul individual, verifică regulile CNPP și casa teritorială de pensii."

