# Entitate: Alocația de stat pentru copii
# Valorile curente sunt verificate pe o sursă oficială a administrației publice.
id: alocatia-copii
nume: "Alocația de stat pentru copii"
tip: valoare_monetara
categorie_ghid: bani
categorie_stiri: general

valoare_curenta:
  brut: 292
  moneda: RON
  in_vigoare_de: "2026-01-01"
  act_normativ: "Legea 61/1993; cuantumul aferent anului 2026 este menținut la nivelul anului 2025 prin măsurile fiscal-bugetare în vigoare"
  sursa_url: "https://ab.prefectura.mai.gov.ro/minuta-sedintei-comisiei-de-dialog-social-a-judetului-alba-din-luna-martie-2026/"
  descriere_lunga: "Alocația de stat pentru copii este 292 lei/lună pentru copiii între 2 și 18 ani și 719 lei/lună pentru copiii de până la 2 ani, respectiv pentru copiii cu handicap în limitele de vârstă prevăzute de lege."
  valoare_secundara: 719
  valoare_secundara_label: "lei/lună pentru copiii de până la 2 ani și pentru copiii cu handicap"

sectiuni:
  - titlu: "Cine beneficiază de alocație?"
    continut: >-
      Alocația de stat se acordă copiilor până la împlinirea vârstei de 18 ani, precum și tinerilor care continuă studiile în condițiile prevăzute de lege. Pentru stabilirea dreptului se aplică regulile din Legea nr. 61/1993 și normele de aplicare.
  - titlu: "Cât este alocația în 2026?"
    continut: >-
      Pentru 2026, cuantumul confirmat de o instituție publică este de **719 lei/lună** pentru copiii de până la 2 ani și pentru copiii cu handicap în categoriile prevăzute de lege, respectiv **292 lei/lună** pentru ceilalți copii beneficiari din grupa generală. Măsurile fiscal-bugetare pentru 2026 mențin cuantumul la nivelul aflat în plată anterior.
  - titlu: "Cum verifici situația concretă?"
    continut: >-
      Pentru un caz individual, verifică documentele emise de Agenția Județeană pentru Plăți și Inspecție Socială / agenția competentă și condițiile exacte din legislația în vigoare. Pagina IZZ oferă orientare și sursa oficială, nu o decizie administrativă.

faq:
  - q: "Care este cuantumul alocației pentru un copil între 2 și 18 ani?"
    a: "292 lei pe lună, conform informației oficiale publicate de Instituția Prefectului Alba în martie 2026."
  - q: "Care este cuantumul pentru un copil de până la 2 ani?"
    a: "719 lei pe lună. Pentru copiii cu handicap se aplică, în limitele de vârstă prevăzute de lege, cuantumul de 719 lei pe lună."
  - q: "Unde cer informații pentru situația mea?"
    a: "La AJPIS/APISMB competentă pentru domiciliul sau reședința ta, în funcție de situația concretă."

