# Entitate: Alocația de stat pentru copii
# Cuantum verificat pe surse oficiale publicate în 2026.

id: alocatia-copii
nume: "Alocația de stat pentru copii"
tip: valoare_monetara
categorie_ghid: bani
categorie_stiri: general

valoare_curenta:
  brut: 292
  moneda: RON
  in_vigoare_de: "2026-01-01"
  act_normativ: "Legea 61/1993; art. XXV lit. k din Legea 141/2025"
  sursa_url: "https://legislatie.just.ro/Public/DetaliiDocument/300022"
  descriere_lunga: "În 2026, alocațiile de stat pentru copii se mențin la nivelul acordat sau cuvenit pentru luna decembrie 2025. Pentru copiii între 2 și 18 ani fără handicap cuantumul este 292 lei/lună; pentru copiii până la 2 ani și pentru copiii cu handicap cuantumul este 719 lei/lună."
  valoare_secundara: 719
  valoare_secundara_label: "lei/lună pentru copii până la 2 ani și pentru copiii cu handicap"

sectiuni:
  - titlu: "Cine beneficiază de alocație?"
    continut: >-
      Alocația de stat se acordă copiilor până la 18 ani, iar în situațiile prevăzute de lege poate
      continua pentru tinerii care urmează cursurile liceale sau profesionale. Acordarea alocației
      de stat nu este condiționată de venitul familiei.
  - titlu: "Cât este alocația în 2026?"
    continut: >-
      **719 lei/lună** pentru copiii până la 2 ani, pentru copiii cu handicap până la 3 ani și pentru
      copiii cu handicap între 3 și 18 ani. **292 lei/lună** pentru copiii între 2 și 18 ani fără
      handicap și pentru tinerii peste 18 ani care continuă studiile în condițiile legii.

      Art. XXV lit. k din Legea nr. 141/2025 menține în anul 2026 alocațiile de stat pentru copii
      la nivelul acordat sau cuvenit pentru luna decembrie 2025.
  - titlu: "Cum depui cererea?"
    continut: >-
      Cererea și documentele se depun potrivit procedurii locale aplicabile, de regulă prin primăria
      sau serviciul de asistență socială de la domiciliu. Verifică lista de documente cerută de
      autoritatea competentă înainte de depunere.

faq:
  - q: "Se acordă alocația în funcție de venitul părinților?"
    a: "Nu. Alocația de stat este un drept distinct de beneficiile sociale condiționate de venit."
  - q: "Care sunt cuantumurile în 2026?"
    a: "719 lei pe lună pentru copiii din tranșele speciale prevăzute de lege și 292 lei pe lună pentru copiii între 2 și 18 ani fără handicap."
  - q: "De ce nu a crescut alocația în 2026?"
    a: "Legea nr. 141/2025 prevede menținerea în 2026 a alocațiilor de stat pentru copii la nivelul acordat sau cuvenit pentru decembrie 2025."

