sectiuni:
  - titlu: "Cine beneficiază de salariul minim?"
    continut: >-
      Salariul minim se aplică angajaților în condițiile legislației muncii. Valoarea de 4.325 lei este salariul de bază minim brut pentru norma întreagă, fără sporuri și alte adaosuri.
  - titlu: "Facilitatea de 200 lei în 2026"
    continut: >-
      OUG nr. 89/2025 prevede pentru perioada **1 iulie–31 decembrie 2026** o sumă de **200 lei/lună** din veniturile salariale pentru care, dacă sunt îndeplinite cumulativ condițiile din actul normativ, nu se datorează impozit pe venit și contribuții sociale obligatorii. Facilitatea se aplică, între altele, salariaților cu normă întreagă la funcția de bază al căror salariu de bază brut este egal cu salariul minim și al căror venit brut relevant nu depășește 4.600 lei. Pentru fracții de lună sau situații care nu îndeplinesc condițiile, suma se diminuează ori facilitatea nu se aplică.
  - titlu: "Cum se calculează salariul net?"
    continut: >-
      Calculatorul IZZ este o **estimare** pentru un angajat fără persoane în întreținere, la funcția de bază. Nu include deduceri suplimentare și nu aplică automat facilitatea specială de 200 lei pentru 1 iulie–31 decembrie 2026; pentru suma exactă trebuie folosite condițiile din contract și statul de plată.

faq:
  - q: "Cât este salariul minim brut de la 1 iulie 2026?"
    a: "4.325 lei pe lună pentru un program normal de lucru în medie de 166,667 ore pe lună, potrivit HG nr. 146/2026."
  - q: "Ce este facilitatea de 200 lei din a doua jumătate a anului 2026?"
    a: "Este suma lunară care, în condițiile cumulative prevăzute de OUG nr. 89/2025, este exceptată de la impozit pe venit și contribuții sociale obligatorii pentru anumite venituri salariale."
  - q: "Calculatorul IZZ include această facilitate?"
    a: "Nu automat. Calculatorul este orientativ și nu poate stabili singur dacă toate condițiile legale pentru facilitate sunt îndeplinite."
  - q: "Salariul minim include sporurile?"
    a: "Nu. Sporurile și alte adaosuri se tratează distinct față de salariul de bază minim brut."

