sectiuni:
  - titlu: "Cât este salariul minim în 2026?"
    continut: >-
      Începând cu **1 iulie 2026**, salariul de bază minim brut pe țară garantat în plată este
      **4.325 lei/lună**, potrivit HG nr. 146/2026. Valoarea orară stabilită prin hotărâre este
      25,949 lei pentru programul normal de lucru prevăzut de act.
  - titlu: "Cine beneficiază de salariul minim?"
    continut: >-
      Salariul minim se aplică în condițiile legii contractelor individuale de muncă pentru care
      este relevant plafonul minim național. Pentru muncă cu timp parțial, drepturile salariale se
      raportează la timpul lucrat și la regulile fiscale aplicabile.
  - titlu: "Cum se calculează salariul net?"
    continut: >-
      Pentru orientare, din salariul brut se calculează contribuțiile și impozitul potrivit regulilor
      fiscale în vigoare. Calculatorul IZZ de mai jos folosește aceleași date de bază ca această
      pagină; rezultatul este orientativ și poate diferi de fluturaș în funcție de situația concretă.

faq:
  - q: "Când a intrat în vigoare salariul minim de 4.325 lei?"
    a: "De la 1 iulie 2026, potrivit HG nr. 146/2026."
  - q: "Care este salariul minim brut în România în prezent?"
    a: "Începând cu 1 iulie 2026, valoarea este de 4.325 lei pe lună."
  - q: "Există salarii minime distincte pentru unele sectoare?"
    a: "Da. Unele domenii pot avea reglementări salariale distincte, care trebuie verificate în actul normativ aplicabil."

