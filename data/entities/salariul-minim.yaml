# Portate din data/utilities.json (calea /utile/, inlocuita de /ghiduri/ pe 17 iul 2026). Din cele
# cinci sectiuni ale sursei intra doua. Nu intra: „Cat este salariul minim in 2026?" (repeta blocul
# „Pe scurt"), „Istoric 2019-2026" (tabel Markdown peste tabelul generat din `istoric`) si
# „Diferente pe sectoare" — ultima dadea 3.436 lei pentru agricultura, cifra pe care n-am putut-o
# sustine cu actul in vigoare dupa HG 146/2026.
sectiuni:
  - titlu: "Cine beneficiază de salariul minim?"
    continut: >-
      Salariul minim se aplică **tuturor angajaților** cu contract individual de muncă, indiferent
      de domeniu sau vechime. Sectorul construcțiilor face excepție, cu un salariu minim propriu
      stabilit prin act separat, iar la timp parțial salariul se aplică proporțional cu orele
      lucrate. Angajatorii care nu respectă salariul minim riscă amenzi între 3.000 și 5.000 lei
      per angajat.
  - titlu: "Cum se calculează salariul net?"
    continut: >-
      Din salariul brut se rețin: **CAS** (contribuția la pensii, 25%), **CASS** (contribuția la
      sănătate, 10%), și **impozitul pe venit** (10% aplicat la baza impozabilă: brut - CAS - CASS
      - deduceri personale). Deducerea personală nu este o cotă fixă: se acordă la funcția de bază,
      sub un plafon de venit brut, și scade pe măsură ce salariul crește. Calculatorul de mai jos
      folosește o aproximare — 20% din salariul minim brut, pentru un angajat fără persoane în
      întreținere — deci dă un **ordin de mărime, nu suma exactă din fluturaș**.

faq:
  - q: "Când intră în vigoare noul salariu minim?"
    a: "La data prevăzută în hotărârea de guvern care îl stabilește, după publicarea în Monitorul Oficial. Nu e mereu 1 ianuarie: HG 146/2026, publicată în martie 2026, se aplică de la 1 iulie 2026."
  - q: "Se aplică salariul minim și la normă parțială?"
    a: "Da, proporțional cu timpul lucrat. Pentru 4 ore/zi, salariul minim este jumătate din valoarea pentru normă întreagă."
  - q: "Ce amenzi riscă angajatorii care nu plătesc salariul minim?"
    a: "Între 3.000 și 5.000 lei pentru fiecare angajat plătit sub salariul minim. Amenda se aplică de către Inspecția Muncii."
  - q: "Salariul minim include și sporurile?"
    a: "Nu. Sporurile (noapte, weekend, ore suplimentare) se adaugă peste salariul minim."

