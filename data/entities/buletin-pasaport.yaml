id: buletin-pasaport
nume: Carte de identitate și pașaport 2026
tip: acte
categorie_ghid: acte
categorie_stiri: general
valoare_curenta:
  in_vigoare_de: '2005-07-20'
  act_normativ: OUG 97/2005 (acte de identitate) și Legea 248/2005 (pașapoarte)
  sursa_url: https://legislatie.just.ro/Public/DetaliiDocument/63354
  descriere_lunga: Cartea de identitate electronică (CIE) se eliberează la nivel național din 2025. Costul
    este de 57 lei pentru adulți (valabilitate 10 ani) și 37 lei pentru minori (valabilitate 5 ani). Pașaportul
    simplu electronic costă 258 lei (valabilitate 10 ani, adulți). Ambele se pot solicita la orice serviciu
    de evidență a populației/pașapoarte, indiferent de domiciliu.
sectiuni:
- titlu: Cartea de identitate — cine, unde, cât costă?
  continut: 'Se eliberează de **Direcția de Evidență a Persoanelor** din cadrul primăriei de domiciliu
    sau reședință. Programarea se face online pe platforma hub.mai.gov.ro. Ai nevoie de: **certificat
    de naștere** (original + copie), **certificat de căsătorie** (dacă e cazul), **documentul de plată
    al taxei**, **dovada adresei de domiciliu** (act de proprietate, contract de închiriere, etc.), și
    **vechiul act de identitate** (dacă e vorba de preschimbare). Termen de eliberare: până la 15 zile
    lucrătoare (5 zile cu taxă de urgență).'
- titlu: Pașaport — costuri și termene
  continut: 'Pașaportul simplu electronic (CRDS) costă **258 lei** pentru persoane peste 12 ani (valabilitate
    10 ani) și **234 lei** pentru minori sub 12 ani (valabilitate 3 ani). Pașaportul temporar costă **100
    lei** (valabilitate 1 an). Se poate solicita la orice serviciu de pașapoarte, indiferent de domiciliu.
    Programare online: epasapoarte.ro. Acte necesare: carte de identitate valabilă, chitanța plății taxei,
    cerere tip. Termen de eliberare: până la 10 zile lucrătoare (3 zile cu taxă de urgență de 100 lei
    suplimentar).'
- titlu: Programare online — cum faci?
  continut: 'Pentru cartea de identitate: platforma **hub.mai.gov.ro** — selectezi județul, instituția,
    data și ora. Pentru pașaport: **epasapoarte.ro** — creezi cont, selectezi serviciul de pașapoarte,
    completezi datele și alegi data. Ambele platforme necesită o adresă de email validă și un număr de
    telefon. Confirmarea se primește pe email. Prezintă-te la ghișeu cu numărul de programare și actele
    necesare.'
faq:
- q: Pot obține cartea de identitate în alt județ?
  a: Da. Din 2025, cartea de identitate se poate solicita la orice serviciu de evidență a populației din
    țară, indiferent de domiciliu.
- q: Cât costă pașaportul în regim de urgență?
  a: Taxa normală (258 lei) + taxa de urgență (100 lei) = 358 lei total. Se eliberează în 3 zile lucrătoare.
- q: Am nevoie de certificat de naștere pentru pașaport?
  a: Doar dacă este prima dată când soliciți pașaport, sau dacă ai schimbat numele (căsătorie, divorț).
    Pentru reînnoire, cartea de identitate valabilă este suficientă.
