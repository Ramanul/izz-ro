# Entitate: Carte de identitate și pașaport 2026
# Valorile curente sunt confruntate cu surse oficiale MAI/DGEP/DGP.
id: buletin-pasaport
nume: "Carte de identitate și pașaport 2026"
tip: acte
categorie_ghid: acte
categorie_stiri: general

valoare_curenta:
  in_vigoare_de: "2026-09-04"
  act_normativ: "OUG 97/2005 privind actele de identitate și Legea 248/2005 privind libera circulație a cetățenilor români în străinătate"
  sursa_url: "https://depabd.mai.gov.ro/intrebari_frecvente.html"
  descriere_lunga: "Pentru CEI, prima carte electronică de identitate este gratuită pentru cetățenii români de la 14 ani, în limita fondurilor disponibile; o nouă CEI costă 70 lei, iar CEI pentru copii sub 14 ani costă 70 lei. Cartea de identitate simplă costă 40 lei. Pentru pașaport simplu electronic sau temporar depus în țară, contravaloarea unică este 265 lei."

sectiuni:
  - titlu: "Cartea electronică de identitate"
    continut: >-
      Cererea pentru CEI poate fi depusă la orice serviciu de evidență a persoanelor, indiferent de domiciliu. Prima CEI este gratuită pentru cetățenii români care au împlinit 14 ani, în limita fondurilor disponibile. Pentru o nouă CEI sau pentru o CEI emisă înainte de 14 ani, taxa este de **70 lei**. Cartea de identitate simplă (CIS) are un tarif de **40 lei**.
  - titlu: "Pașaport — cât costă?"
    continut: >-
      Din **1 august 2025**, pentru cererile depuse la serviciile publice comunitare de pașapoarte, contravaloarea pașaportului simplu electronic sau temporar este de **265 lei**, TVA inclus. Valoarea este unică pentru aceste două tipuri de pașaport în țară, potrivit informării oficiale a Direcției Generale de Pașapoarte.
  - titlu: "Programare și acte"
    continut: >-
      Pentru CEI se folosește platforma oficială HUB MAI, iar pentru pașaport se utilizează pagina de programare online a Direcției Generale de Pașapoarte. Lista exactă a documentelor depinde de tipul cererii; verifică pagina oficială înainte de programare.

faq:
  - q: "Unde pot cere CEI?"
    a: "La orice serviciu de evidență a persoanelor unde este operațional serviciul, indiferent de domiciliu."
  - q: "Cât costă CEI?"
    a: "Prima CEI pentru cetățenii români de la 14 ani este gratuită în limita fondurilor disponibile; o nouă CEI și CEI pentru sub 14 ani costă 70 lei."
  - q: "Cât costă pașaportul în 2026?"
    a: "265 lei pentru pașaport simplu electronic sau temporar depus în țară."

