  act_normativ: "OUG 195/2002 privind circulația pe drumurile publice și actele administrative aplicabile serviciilor de permise"
  sursa_url: "https://hub.mai.gov.ro/serviciu/view?id=69"
  descriere_lunga: "Tariful pentru permisul de conducere este de 89 lei la data de 4 septembrie 2026. Instituțiile prefectului au publicat că tariful va fi 139 lei începând cu 15 septembrie 2026."

sectiuni:
  - titlu: "Cât costă permisul de conducere?"
    continut: >-
      La **4 septembrie 2026**, tariful oficial pentru emiterea permisului de conducere este **89 lei**. Pentru documentele emise după **15 septembrie 2026**, instituțiile prefectului au anunțat tariful de **139 lei**.
  - titlu: "Cum se obține permisul categoria B?"
    continut: >-
      Procedura implică înscrierea la o școală autorizată, pregătirea teoretică și practică, îndeplinirea condițiilor medicale și susținerea probelor prevăzute de legislație. Cerințele exacte trebuie verificate la DGPCI și la serviciul de permise competent la data programării.
  - titlu: "Unde verific taxa și procedura?"
    continut: >-
      Pentru tariful documentului și serviciile administrative, verifică HUB MAI / DGPCI. Pentru procedura de examinare se verifică și actele normative și informațiile publicate de serviciul județean de permise.

faq:
  - q: "Cât costă permisul auto acum?"
    a: "89 lei la 4 septembrie 2026. Tariful anunțat pentru documentele emise începând cu 15 septembrie 2026 este 139 lei."
  - q: "Cât va costa permisul după 15 septembrie 2026?"
    a: "139 lei, conform informărilor publicate de mai multe instituții ale prefectului."
  - q: "Unde verific procedura oficială?"
    a: "Pe HUB MAI, DGPCI și pe pagina serviciului public comunitar din județul în care susții examinarea."

