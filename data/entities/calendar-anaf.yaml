sectiuni:
  - titlu: "Ce trebuie să urmărești în septembrie 2026?"
    continut: >-
      **25 septembrie** este una dintre datele importante din calendarul ANAF. În funcție de situația
      contribuabilului, pot avea termen la această dată declarații precum D100, D208, D224, D300,
      D301 și D390 VIES. Nu toate se aplică aceleiași persoane sau firme.

      **30 septembrie** este o altă dată importantă pentru anumite raportări, inclusiv unele declarații
      informative și raportări SAF-T, în funcție de perioada fiscală și de categoria contribuabilului.

      Pentru termenul exact trebuie verificat calendarul ANAF aplicabil situației concrete.
  - titlu: "Cum folosești calendarul?"
    continut: >-
      Pornește de la **formularul și tipul de obligație** pe care îl ai, apoi verifică rândul corespunzător
      din calendarul ANAF. IZZ este un instrument de orientare și nu înlocuiește verificarea obligației
      concrete în sursa oficială.
  - titlu: "De ce diferă termenele?"
    continut: >-
      Unele obligații sunt lunare, altele trimestriale, semestriale sau anuale. În plus, contribuabilii
      pot avea perioade fiscale și obligații diferite. Nu fiecare dată din calendar este o obligație universală.

faq:
  - q: "Care este una dintre cele mai importante date fiscale din septembrie?"
    a: "25 septembrie este un termen major pentru mai multe declarații și obligații, dar ce anume se aplică depinde de contribuabil și de formular."
  - q: "Trebuie să depun toate formularele din calendar?"
    a: "Nu. Calendarul este o listă generală; obligațiile concrete depind de activitatea, perioada fiscală și statutul contribuabilului."
  - q: "Unde verific termenul exact?"
    a: "În calendarul oficial ANAF și în instrucțiunile formularului aplicabil situației tale."

