# Om în buclă — editezi acest fișier (direct pe GitHub, în browser) ca să controlezi ce apare.
# După salvare, build-ul următor (sau Actions -> Run workflow) aplică modificările.

blocklist_urls: []          # URL-uri de ascuns (lipești linkul exact al sursei)

# titluri care conțin aceste cuvinte -> ascunse
# 2026-08-09: adăugate după ce primariarovinari.ro (WordPress compromis) a împins 8 articole
# de warez pe izz.ro. Lista NU e suficientă singură — atacatorul folosește homoglife
# („To𝚛rent" cu „r" matematic, „Frее" cu „е" chirilic), deci vezi și `suppress_sources` de mai
# jos și garda din `fetch.py` (_pare_spam_injectat). Aici stau doar cuvintele curate.
blocklist_keywords:
  - torrent
  - crack fixed
  - elamigos
  - keygen
  - kmspico
  - repack
  - nulled
  - web-dl
  - steam-rip
  - full version

# o sursă pe care o oprești temporar (ex.: gsp)
# 2026-08-09 — pl_gorj_oras_rovinari: site-ul primăriei Rovinari e COMPROMIS. Feed-ul lui
# publică pagini de software piratat la fiecare ~3h, printre anunțurile reale ale primăriei.
# Suprimarea taie TOATE cele 11 articole de la ei, inclusiv cele 3 legitime — deliberat: cât
# timp atacatorul are acces la CMS, nimic de la sursa asta nu e de încredere.
# Se ridică DOAR după ce primăria curăță site-ul și se reverifică manual feed-ul.
suppress_sources:
  - pl_gorj_oras_rovinari
  # Defaced 2026-08-09 („Hacked by Chinafans" + linkuri Telegram), descoperit 11 aug. A stat
  # live pe izz.ro doua zile: niciunul din cele cinci straturi de continut nu-l prindea, fiindca
  # titlul n-are niciun marker ostil — doar e in engleza pe o sursa 100% romaneasca. Vezi
  # `guard.anomalie` si comentariul din `local_sources._DEAD_SLUGS`.
  - pl_suceava_oras_cajvana
  - piataauto
corrections:                # corectezi un titlu/teaser greșit de AI, pe un URL anume
  # "https://sursa.ro/articol": { title: "Titlu corect", teaser: "Rezumat corect." }
featured: []                # URL-uri pe care le forțezi în hero (sus de tot)
# true = sintezele C (multi-sursă) NU se publică până nu le aprobi tu, una câte una, punându-le
# URL-ul în `approved` mai jos. Rularea tipărește lista celor reținute, cu titlu și link.
# Până pe 2026-08-15 steagul ăsta nu bloca nimic — doar tipărea un mesaj, în timp ce articolele
# se publicau normal. Acum reține efectiv.
#
# ATENȚIE, contează legal: exceptarea de la AI Act art. 50 se sprijină pe control editorial real.
# Poarta asta o face POSIBILĂ, nu o dovedește — dacă aprobi fără să citești, exceptarea nu ține.
# Aprobarea trebuie să fie a unui om care chiar a citit textul și își asumă răspunderea pentru el.
hold_important: false

# URL-urile sintezelor C pe care le-ai citit și le aprobi pentru publicare.
# Contează doar când `hold_important: true`. Formatul e ca la `blocklist_urls` — linkul exact.
approved: []
